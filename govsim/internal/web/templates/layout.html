{{define "head"}}<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — имитатор ЕГАИС</title>
<style>
  :root { --ink: #1f2430; --muted: #5d6475; --line: #d7dbe3; --accent: #2f3a8f; --bad: #b3261e; --good: #2e6b3f; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #f4f5f8; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  header b { margin-right: 12px; }
  header a { color: var(--accent); text-decoration: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  p.lead { color: var(--muted); margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; background: #fff; margin-bottom: 20px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; background: #fafbfc; }
  code, .code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-all; }
  form.inline { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  input, select, button { font: inherit; padding: 4px 8px; border: 1px solid #9aa1b1; border-radius: 4px; background: #fff; }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  .down { color: var(--bad); font-weight: 600; }
  .ok { color: var(--good); }
  .bad { color: var(--bad); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 14px; margin-bottom: 16px; }
  pre { white-space: pre-wrap; font-size: 12px; max-height: 240px; overflow: auto; background: #fafbfc; padding: 8px; margin: 4px 0 0; }
  @media print { header, .noprint { display: none; } body { background: #fff; } main { padding: 0; } }
</style>
</head>
<body>
<header class="noprint">
  <b>Имитатор ЕГАИС · ГИС МТ · поставщик</b>
  <a href="/">Участники и сценарии</a>
  <a href="/ui/shipments">Поставки</a>
  <a href="/ui/journal">Журнал</a>
  <a href="/ui/marks">Марка</a>
  <a href="/ui/crpt">«Честный знак»</a>
</header>
<main>
{{end}}

{{define "foot"}}</main>
</body>
</html>{{end}}
