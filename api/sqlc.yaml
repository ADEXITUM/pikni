version: "2"
overrides:
  go:
    rename:
      location_ids: LocationIDs
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          type: time.Time
          pointer: true
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/locations
    gen:
      go:
        package: store
        out: internal/locations/store
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/users
    gen:
      go:
        package: store
        out: internal/users/store
        sql_package: pgx/v5
        omit_unused_structs: true
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/auth
    gen:
      go:
        package: store
        out: internal/auth/store
        sql_package: pgx/v5
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        initialisms: [id, ip, csrf]
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/audit
    gen:
      go:
        package: store
        out: internal/audit/store
        sql_package: pgx/v5
        omit_unused_structs: true
        emit_pointers_for_null_types: true
        initialisms: [id, ip]
