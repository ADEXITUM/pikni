version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/locations
    gen:
      go:
        package: store
        out: internal/locations/store
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
