<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-labelledby="title">
  <title id="title">Пикни без связи: сканы ждут отправки</title>
  <defs>
    <clipPath id="pk-body"><rect x="30" y="22" width="100" height="104" rx="22"/></clipPath>
    <filter id="pk-sticker" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grown"/>
      <feFlood flood-color="#FFFDF8"/>
      <feComposite in2="grown" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
