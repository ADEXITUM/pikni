version: '3'

output: prefixed

vars:
  COMPOSE: docker compose -f deploy/compose.dev.yaml
  SQLC_IMAGE: sqlc/sqlc:1.31.1
  GOLANGCI_LINT: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
  # task dev OBS=1 — запустить вместе с Grafana и отправлять туда телеметрию
  OBS: ''

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Установить зависимости фронтенда
    dir: web
    cmds:
      - npm ci

  up:
    desc: Поднять PostgreSQL (и Grafana при OBS=1)
    cmds:
      - '{{.COMPOSE}} up -d --wait postgres'
      - cmd: '{{.COMPOSE}} --profile obs up -d otel-lgtm'
        if: '[ -n "{{.OBS}}" ]'

  down:
    desc: Остановить контейнеры
    cmds:
      - '{{.COMPOSE}} --profile obs down'

  migrate:
    desc: Применить миграции схемы (и завести базу имитатора, если её ещё нет)
    cmds:
      - task: govsim:db
      - cmd: go run ./cmd/migrate
        dir: api
      - cmd: go run ./cmd/govsim migrate
        dir: govsim

  govsim:db:
    internal: true
    desc: Роль и база имитатора в существующем томе PostgreSQL — скрипт первичной настройки их не создаст
    cmds:
      - |
        {{.COMPOSE}} exec -T postgres psql -U postgres -d pikni -q -v ON_ERROR_STOP=1 <<'SQL'
        select 'create role govsim login password ''govsim''' where not exists (select from pg_roles where rolname = 'govsim') \gexec
        select 'create database govsim owner govsim' where not exists (select from pg_database where datname = 'govsim') \gexec
        SQL

  seed:
    desc: Загрузить тестовые данные в локальную базу
    cmds:
      - '{{.COMPOSE}} exec -T postgres psql -U pikni_owner -d pikni -q -v ON_ERROR_STOP=1 -f /seed/dev.sql'
      - task: seed:catalog
      - '{{.COMPOSE}} exec -T postgres psql -U pikni_owner -d pikni -q -v ON_ERROR_STOP=1 -f /seed/matrix.sql'
      - task: seed:govsim

  seed:govsim:
    internal: true
    dir: govsim
    cmds:
      - go run ./cmd/govsim seed -catalog ../api/db/seed/catalog.csv

  seed:catalog:
    internal: true
    dir: api
    cmds:
      - go run ./cmd/admin import-catalog -file db/seed/catalog.csv -if-empty

  db:reset:
    desc: Пересоздать локальную базу с нуля
    prompt: Локальная база будет удалена. Продолжить?
    cmds:
      - '{{.COMPOSE}} down -v postgres'
      - task: up
      - task: migrate
      - task: seed

  # Демо-данные (решение 0063): реальный каталог, сеть «Чекушка» — 3 крупных магазина, 1 у дома,
  # 2 склада — и год работы. Генерация занимает около часа, поэтому результат сохраняется копиями
  # баз в .demo/, а `task demo` восстанавливает их за пару минут.
  demo:
    desc: Демо-данные в локальную базу — из готовой копии, а если её нет, собрать (около часа)
    cmds:
      - cmd: task demo:restore
        if: '[ -f .demo/pikni.dump ]'
      - cmd: task demo:build
        if: '[ ! -f .demo/pikni.dump ]'

  demo:build:
    desc: 'Собрать демо-данные заново и сохранить копию в .demo/ (дней истории: DAYS=365)'
    prompt: Локальные базы pikni и govsim будут пересозданы. Продолжить?
    vars:
      DAYS: '{{.DAYS | default "365"}}'
    cmds:
      - task: up
      - task: demo:recreate
      - task: migrate
      - '{{.COMPOSE}} exec -T postgres psql -U pikni_owner -d pikni -q -v ON_ERROR_STOP=1 -f /seed/dev.sql'
      - cmd: go run ./cmd/admin import-catalog -file db/seed/catalog-full.csv
        dir: api
      - cmd: mkdir -p ../.demo && go run ./cmd/admin seed-demo-year -days {{.DAYS}} -rests ../.demo/rests.json
        dir: api
      - cmd: go run ./cmd/admin seed-users
        dir: api
      - cmd: go run ./cmd/govsim seed -catalog ../api/db/seed/catalog-full.csv && go run ./cmd/govsim seed-rests -file ../.demo/rests.json
        dir: govsim
      - '{{.COMPOSE}} exec -T postgres pg_dump -U postgres -Fc pikni > .demo/pikni.dump'
      - '{{.COMPOSE}} exec -T postgres pg_dump -U postgres -Fc govsim > .demo/govsim.dump'

  demo:restore:
    desc: Восстановить демо-данные из копии в .demo/ (новые миграции применятся после)
    prompt: Локальные базы pikni и govsim будут заменены копией. Продолжить?
    cmds:
      - task: up
      - task: demo:recreate
      - '{{.COMPOSE}} exec -T postgres pg_restore -U postgres -d pikni --single-transaction < .demo/pikni.dump'
      - '{{.COMPOSE}} exec -T postgres pg_restore -U postgres -d govsim --single-transaction < .demo/govsim.dump'
      - task: migrate

  demo:recreate:
    internal: true
    cmds:
      - task: govsim:db
      - |
        {{.COMPOSE}} exec -T postgres psql -U postgres -q -v ON_ERROR_STOP=1 <<'SQL'
        drop database if exists pikni with (force);
        create database pikni owner pikni_owner;
        drop database if exists govsim with (force);
        create database govsim owner govsim;
        \c pikni
        alter default privileges for role pikni_owner in schema public grant select, insert, update, delete on tables to pikni_app;
        alter default privileges for role pikni_owner in schema public grant usage, select on sequences to pikni_app;
        SQL

  scenario:
    desc: 'Состояние для проверки руками: task scenario -- list | all | stocktake-counting'
    dir: api
    cmds:
      - go run ./cmd/admin scenario {{.CLI_ARGS}}

  users:
    desc: Учётные записи всех ролей с паролем «Пикни-демо-2026» (кассирам PIN 2468)
    dir: api
    cmds:
      - go run ./cmd/admin seed-users

  admin:
    desc: 'Учётные записи из консоли: task admin -- create-admin -login admin'
    dir: api
    cmds:
      - go run ./cmd/admin {{.CLI_ARGS}}

  psql:
    desc: Открыть консоль psql
    interactive: true
    cmds:
      - '{{.COMPOSE}} exec postgres psql -U pikni_owner -d pikni'

  dev:
    desc: Запустить базу, API с автоперезапуском и фронтенд в одном терминале
    cmds:
      - task: up
      - task: migrate
      - task: dev:run

  dev:https:
    desc: Как dev, но фронтенд по HTTPS и виден в локальной сети — для камеры на телефоне
    cmds:
      - task: up
      - task: migrate
      - task: dev:run
        vars: { HTTPS: '1' }

  dev:run:
    internal: true
    deps:
      - dev:api
      - dev:govsim
      - task: dev:web
        vars: { HTTPS: '{{.HTTPS}}' }

  dev:api:
    internal: true
    dir: api
    env:
      LOG_FORMAT: text
      OTEL_EXPORTER_OTLP_ENDPOINT: '{{if .OBS}}http://localhost:4318{{end}}'
      OTEL_METRIC_EXPORT_INTERVAL: '10000'
    cmds:
      - go tool air

  dev:govsim:
    internal: true
    dir: govsim
    cmds:
      - go run ./cmd/govsim serve

  dev:web:
    internal: true
    deps:
      - task: dev:staff
        vars: { HTTPS: '{{.HTTPS}}' }
      - dev:pos

  dev:staff:
    internal: true
    dir: web
    env:
      PIKNI_HTTPS: '{{.HTTPS}}'
    cmds:
      - npm run dev:staff

  dev:pos:
    internal: true
    dir: web
    cmds:
      - npm run dev:pos

  gen:
    desc: Сгенерировать код из OpenAPI и SQL
    cmds:
      - task: gen:api
      - task: gen:sqlc
      - task: gen:web

  gen:api:
    internal: true
    dir: api
    cmds:
      - go tool oapi-codegen -config oapi-codegen.yaml ../openapi/pikni.yaml
      - go tool oapi-codegen -config oapi-codegen-pos.yaml ../openapi/pos.yaml

  gen:sqlc:
    internal: true
    dir: api
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}/api:/src" -w /src {{.SQLC_IMAGE}} generate

  gen:web:
    internal: true
    dir: web
    cmds:
      - npm run gen

  test:
    desc: Тесты сервера и фронтенда
    cmds:
      - task: test:api
      - task: test:web

  test:api:
    dir: api
    cmds:
      - go test ./...

  test:web:
    dir: web
    cmds:
      - npm test

  e2e:
    desc: 'Сквозные тесты Playwright; нужен запущенный task dev, первый раз — E2E_TEMP_PASSWORD'
    dir: web/apps/staff
    cmds:
      - npx playwright test

  lint:
    desc: Проверки кода сервера и фронтенда
    cmds:
      - task: lint:api
      - task: lint:web

  lint:api:
    dir: api
    cmds:
      - go vet ./...
      - go run {{.GOLANGCI_LINT}} run

  lint:web:
    dir: web
    cmds:
      - npm run type-check -w @pikni/staff
      - npm run lint:check -w @pikni/staff
      - npm run type-check -w @pikni/pos
      - npm run lint:check -w @pikni/pos
      - npx --prefix apps/staff prettier --check .

  check:
    desc: Всё, что проверяет CI
    cmds:
      - task: lint
      - task: test
