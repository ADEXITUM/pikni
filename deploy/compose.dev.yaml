name: pikni-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pikni
      PIKNI_OWNER_PASSWORD: pikni_owner
      PIKNI_APP_PASSWORD: pikni_app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # С версии 18 образ хранит данные в подкаталоге /var/lib/postgresql/18/docker,
      # поэтому том монтируется на уровень выше.
      - pgdata:/var/lib/postgresql
      - ../api/db/initdb/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ../api/db/seed:/seed:ro
    healthcheck:
      # Через TCP, а не сокет: пока выполняются скрипты первичной настройки,
      # временный сервер слушает только сокет, и проверка не должна считать его готовым.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d pikni"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    profiles: [obs]
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4318:4318"
    # Дашборд «Пикни» и правила оповещений — те же, что на сервере.
    volumes:
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/pikni.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/pikni-dashboards:ro
      - ./grafana/alerting/pikni-rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/pikni-rules.yaml:ro

volumes:
  pgdata:
