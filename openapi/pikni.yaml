          items:
            type: string
            format: uuid
        isBlocked:
          type: boolean
        mustChangePassword:
          type: boolean
        lockedUntil:
          type: string
          format: date-time
          description: Вход временно закрыт после неудачных попыток
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time

    UserList:
      type: object
      required: [items, total]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"

    NewUser:
      type: object
      required: [login, fullName, role, locationIds]
      properties:
        login:
          type: string
          pattern: "^[A-Za-z0-9._-]{3,32}$"
          example: a.petrova
        fullName:
          type: string
          example: Петрова А. В.
        role:
          $ref: "#/components/schemas/Role"
        locationIds:
          type: array
          x-go-name: LocationIDs
          description: Обязательно для ролей магазина и склада, пусто для ролей уровня сети
          items:
            type: string
            format: uuid

    UserUpdate:
      type: object
      required: [fullName, role, locationIds, version]
      properties:
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locationIds:
          type: array
          x-go-name: LocationIDs
          items:
            type: string
            format: uuid
        version:
          type: integer
          format: int32

    CreatedUser:
      type: object
      required: [user, temporaryPassword]
      properties:
        user:
          $ref: "#/components/schemas/User"
        temporaryPassword:
          type: string

    TemporaryPassword:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string

    PinRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          pattern: "^[0-9]{4,6}$"

    PosDevice:
      type: object
      required: [id, locationId, locationCode, locationName, name, keyPrefix, createdAt]
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        locationCode:
          type: string
        locationName:
          type: string
        name:
          type: string
          example: Касса 1
        keyPrefix:
          type: string
          description: Начало ключа — чтобы отличить кассы, сам ключ не хранится
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time

    NewPosDevice:
      type: object
      required: [locationId, name]
      properties:
