openapi: 3.0.3
info:
  title: Пикни API
  version: 0.1.0
  description: API приложения сотрудников «Пикни». Кассовый API описан отдельно в pos.yaml.
servers:
  - url: /api/v1

security:
  - session: []

paths:
  /auth/login:
    post:
      operationId: login
      summary: Вход по логину и паролю
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вход выполнен
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "202":
          description: Пароль верный, нужен одноразовый код (двухфакторная аутентификация)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallenge"
        default:
          $ref: "#/components/responses/Problem"

  /auth/login/totp:
    post:
      operationId: loginTotp
      summary: Второй шаг входа — одноразовый код
      description: Код из приложения-аутентификатора или резервный код. После пяти неверных кодов вход начинают заново.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge:
                  type: string
                  maxLength: 200
                code:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Вход выполнен
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/totp/setup:
    post:
      operationId: setupTotp
      summary: Начать подключение двухфакторной аутентификации
      description: Секрет и ссылка otpauth для QR-кода приложения-аутентификатора. Подключение завершает /auth/totp/enable.
      tags: [auth]
      x-permission: authenticated
      responses:
        "200":
          description: Секрет
          content:
            application/json:
              schema:
                type: object
                required: [secret, url]
                properties:
                  secret:
                    type: string
                  url:
                    type: string
        default:
          $ref: "#/components/responses/Problem"

  /auth/totp/enable:
    post:
      operationId: enableTotp
      summary: Подтвердить подключение кодом из приложения
      tags: [auth]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Подключено; резервные коды показываются один раз
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
        default:
          $ref: "#/components/responses/Problem"

  /auth/totp/disable:
    post:
      operationId: disableTotp
      summary: Отключить двухфакторную аутентификацию
      description: По действующему коду. Администратору отключить нельзя (ПБ-3).
      tags: [auth]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 200
      responses:
        "204":
          description: Отключено
        default:
          $ref: "#/components/responses/Problem"

  /auth/qr:
    post:
      operationId: issueQrLogin
      summary: QR-код для входа на смартфоне
      description: Одноразовый код на 60 секунд для пользователя, который уже вошёл на ПК (ПБ-2).
      tags: [auth]
      x-permission: authenticated
      responses:
        "200":
          description: Код
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt]
                properties:
                  code:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        default:
          $ref: "#/components/responses/Problem"

  /auth/qr/redeem:
    post:
      operationId: redeemQrLogin
      summary: Войти по QR-коду с ПК
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Вход выполнен
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/demo:
    get:
      operationId: listDemoRoles
      summary: Быстрый вход на демонстрационном стенде
      description: Роли для входа одной кнопкой (п. 4.1.4). Вне демонстрационного режима — 404.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Роли
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        default:
          $ref: "#/components/responses/Problem"

  /auth/demo/{role}:
    post:
      operationId: demoLogin
      summary: Войти под ролью на демонстрационном стенде
      tags: [auth]
      security: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: Вход выполнен
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: Выход
      tags: [auth]
      x-permission: authenticated
      responses:
        "204":
          description: Сессия завершена
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        default:
          $ref: "#/components/responses/Problem"

  /auth/me:
    get:
      operationId: getMe
      summary: Текущий пользователь и CSRF-токен сессии
      tags: [auth]
      x-permission: authenticated
      responses:
        "200":
          description: Сессия действительна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/password:
    post:
      operationId: changePassword
      summary: Смена своего пароля
      x-permission: authenticated
      description: Остальные сессии пользователя завершаются.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Пароль изменён
        default:
          $ref: "#/components/responses/Problem"

  /auth/sessions:
    get:
      operationId: listMySessions
      summary: Мои активные сеансы
      tags: [auth]
      x-permission: authenticated
      responses:
        "200":
          description: Сеансы от последней активности к ранней
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: endOtherSessions
      summary: Завершить все свои сеансы, кроме текущего
      tags: [auth]
      x-permission: authenticated
      responses:
        "204":
          description: Остальные сеансы завершены
        default:
          $ref: "#/components/responses/Problem"

  /auth/sessions/{id}:
    delete:
      operationId: endSession
      summary: Завершить свой сеанс
      tags: [auth]
      x-permission: authenticated
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Сеанс завершён
        default:
          $ref: "#/components/responses/Problem"

  /audit:
    get:
      operationId: listAuditLog
      summary: Журнал действий
      description: Записи от новых к старым. Следующая страница — параметр before из nextBefore.
      tags: [audit]
      x-permission: audit.view
      parameters:
        - name: before
          in: query
          description: Только записи с номером меньше указанного
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditUserID"
        - $ref: "#/components/parameters/AuditActionFilter"
        - $ref: "#/components/parameters/AuditEntityType"
        - $ref: "#/components/parameters/AuditEntityID"
      responses:
        "200":
          description: Страница журнала
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Problem"

  /users:
    get:
      operationId: listUsers
      summary: Сотрудники
      description: Поиск по логину и ФИО, фильтры и страница; total — сколько найдено всего.
      tags: [users]
      x-permission: users.view
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/Role"
        - name: locationId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [active, blocked, temporary]
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, login, -login, role, -role, created, -created]
            default: name
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Страница сотрудников
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUser
      summary: Создать сотрудника
      description: Пароль генерирует сервер и показывает один раз. При первом входе сотрудник придумывает свой.
      tags: [users]
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
      responses:
        "201":
          description: Сотрудник создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}:
    put:
      operationId: updateUser
      summary: Изменить ФИО, роль и точки
      description: Оптимистическая блокировка — version из открытой карточки. Если карточку уже изменили, ответ 409.
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Сотрудник изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/block:
    post:
      operationId: blockUser
      summary: Заблокировать сотрудника и завершить его сеансы
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сотрудник заблокирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/unblock:
    post:
      operationId: unblockUser
      summary: Разблокировать сотрудника
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сотрудник разблокирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/password:
    post:
      operationId: resetUserPassword
      summary: Сбросить пароль
      description: Выдаёт временный пароль, снимает блокировку за ошибки входа и завершает сеансы сотрудника.
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Временный пароль, показывается один раз
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPassword"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/sessions:
    delete:
      operationId: endUserSessions
      summary: Завершить все сеансы сотрудника
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Сеансы завершены
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/pin:
    put:
      operationId: setUserPin
      summary: Задать PIN для входа на кассе
      description: 4–6 цифр. Кассир входит на кассе по логину и PIN; PIN хранится хешем, как пароль.
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinRequest"
      responses:
        "204":
          description: PIN задан
        default:
          $ref: "#/components/responses/Problem"

  /pos-devices:
    get:
      operationId: listPosDevices
      summary: Кассы
      tags: [users]
      x-permission: pos.devices
      responses:
        "200":
          description: Кассы доступных пользователю точек (администратору — всех, управляющему — своего магазина)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosDevice"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPosDevice
      summary: Зарегистрировать кассу
      description: >
        Касса привязывается к магазину. Ключ кассы показывается один раз — его вводят в кассовой
        программе или сканируют QR-код. В базе хранится только хеш ключа.
      tags: [users]
      x-permission: pos.devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPosDevice"
      responses:
        "201":
          description: Касса и её ключ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosDeviceKey"
        default:
          $ref: "#/components/responses/Problem"

  /pos-devices/{id}/revoke:
    post:
      operationId: revokePosDevice
      summary: Отключить кассу
      description: Ключ перестаёт действовать сразу; потерянную или заменённую кассу регистрируют заново.
      tags: [users]
      x-permission: pos.devices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Касса отключена
        default:
          $ref: "#/components/responses/Problem"

  /audit/export:
    get:
      operationId: exportAuditLog
      summary: Выгрузка журнала в Excel
      description: Те же фильтры, что у списка. Время в файле — в часовом поясе tz.
      tags: [audit]
      x-permission: audit.view
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditUserID"
        - $ref: "#/components/parameters/AuditActionFilter"
        - $ref: "#/components/parameters/AuditEntityType"
        - $ref: "#/components/parameters/AuditEntityID"
        - name: tz
          in: query
          description: Часовой пояс IANA для времени в файле, по умолчанию UTC
          schema:
            type: string
            example: Asia/Yakutsk
      responses:
        "200":
          description: Файл XLSX
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /locations:
    get:
      operationId: listLocations
      summary: Точки сети
      tags: [locations]
      x-permission: refs.view
      responses:
        "200":
          description: Склады и магазины, упорядоченные по коду
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createLocation
      summary: Создать точку
      description: Зоны учёта создаются вместе с точкой — у склада одна, у магазина две.
      tags: [locations]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewLocation"
      responses:
        "201":
          description: Точка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        default:
          $ref: "#/components/responses/Problem"

  /locations/{id}:
    get:
      operationId: getLocation
      summary: Карточка точки
      tags: [locations]
      x-permission: refs.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Точка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateLocation
      summary: Изменить точку
      description: Код и тип точки не меняются. Оптимистическая блокировка по version.
      tags: [locations]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Точка изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        default:
          $ref: "#/components/responses/Problem"

  /locations/{id}/sale-check:
    get:
      operationId: checkSale
      summary: Можно ли продавать алкоголь в точке
      description: >
        Проверка по правилам региона точки и федеральным правилам на момент at (по умолчанию — сейчас),
        отдельно для продукции крепче 15 % и для остальной алкогольной продукции.
      tags: [locations]
      x-permission: refs.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: at
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Результат проверки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleCheck"
        default:
          $ref: "#/components/responses/Problem"

  /sale-rules:
    get:
      operationId: listSaleRules
      summary: Правила продажи алкоголя и дни полного запрета
      tags: [locations]
      x-permission: refs.view
      responses:
        "200":
          description: Все редакции правил и дни запрета
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleRulebook"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSaleRule
      summary: Добавить редакцию правила продажи
      description: Без subjectCode — федеральное правило. Старые редакции не меняются.
      tags: [locations]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSaleRule"
      responses:
        "201":
          description: Редакция добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleRule"
        default:
          $ref: "#/components/responses/Problem"

  /sale-rules/{id}:
    delete:
      operationId: deleteSaleRule
      summary: Удалить редакцию, которая ещё не вступила в силу
      tags: [locations]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Редакция удалена
        default:
          $ref: "#/components/responses/Problem"

  /sale-bans:
    post:
      operationId: createSaleBan
      summary: Добавить день полного запрета
      tags: [locations]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSaleBan"
      responses:
        "201":
          description: День запрета добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleBan"
        default:
