openapi: 3.0.3
info:
  title: Пикни API
  version: 0.1.0
  description: API приложения сотрудников «Пикни». Кассовый API описан отдельно в pos.yaml.
servers:
  - url: /api/v1

security:
  - session: []

paths:
  /auth/login:
    post:
      operationId: login
      summary: Вход по логину и паролю
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вход выполнен
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: Выход
      tags: [auth]
      x-permission: authenticated
      responses:
        "204":
          description: Сессия завершена
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        default:
          $ref: "#/components/responses/Problem"

  /auth/me:
    get:
      operationId: getMe
      summary: Текущий пользователь и CSRF-токен сессии
      tags: [auth]
      x-permission: authenticated
      responses:
        "200":
          description: Сессия действительна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/password:
    post:
      operationId: changePassword
      summary: Смена своего пароля
      x-permission: authenticated
      description: Остальные сессии пользователя завершаются.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Пароль изменён
        default:
          $ref: "#/components/responses/Problem"

  /locations:
    get:
      operationId: listLocations
      summary: Точки сети
      tags: [locations]
      x-permission: refs.view
      responses:
        "200":
          description: Склады и магазины, упорядоченные по коду
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationList"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pikni_sid
      description: >
        Cookie сессии, выдаётся при входе. Изменяющие запросы (POST, PUT, PATCH, DELETE)
        дополнительно передают заголовок X-CSRF-Token со значением csrfToken из ответа входа или /auth/me.
        Право, нужное операции, указано в расширении x-permission (authenticated — любой вошедший пользователь).

  headers:
    SessionCookie:
      description: Cookie сессии pikni_sid (HttpOnly, Secure, SameSite=Lax, Path=/api)
      schema:
        type: string

  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Role:
      type: string
      enum: [admin, manager, accountant, store_manager, storekeeper, cashier]

    Permission:
      type: string
      description: Право доступа. Матрица «роль → права» повторяет таблицу ПБ-6 ТЗ.
      enum:
        - users.manage
        - refs.view
        - refs.edit
        - cost.view
        - receipt.view
        - receipt.edit
        - floor.view
        - floor.edit
        - transfer.request
        - transfer.view
        - transfer.edit
        - pos.view
        - pos.sell
        - writeoff.create
        - docs.approve
        - stocktake.manage
        - stocktake.count
        - reservations.manage
        - availability.view
        - egais.reconcile
        - assets.view
        - assets.edit
        - reports.view
        - audit.view

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: petrova
        password:
          type: string
          format: password

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    Me:
      type: object
      required: [id, login, fullName, role, mustChangePassword, csrfToken, permissions, locationIds]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        fullName:
          type: string
          example: Петрова А. В.
        role:
          $ref: "#/components/schemas/Role"
        mustChangePassword:
          type: boolean
          description: Вход по временному паролю; до смены доступны только /auth/*
        csrfToken:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        locationIds:
          type: array
          x-go-name: LocationIDs
          description: Точки, с которыми работает пользователь. Для ролей уровня сети – все точки
          items:
            type: string
            format: uuid

    LocationKind:
      type: string
      enum: [warehouse, store]

    Location:
      type: object
      required: [id, code, name, kind, city, timezone]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: МГ-01
        name:
          type: string
          example: Магазин на ул. Ленина
        kind:
          $ref: "#/components/schemas/LocationKind"
        city:
          type: string
          example: Благовещенск
        timezone:
          type: string
          description: Часовой пояс IANA
          example: Asia/Yakutsk

    LocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Не найдено
        status:
          type: integer
          example: 404
        detail:
          type: string
