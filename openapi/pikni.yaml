      properties:
        variantId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        floor:
          type: integer
          description: В торговом зале
        storage:
          type: integer
          description: На складе магазина или распределительном складе
        reserved:
          type: integer
        inTransit:
          type: integer

    AvailabilityCard:
      type: object
      required: [productId, name, categoryName, countryName, crptMarked, attributes, variants, locations, cells]
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
        categoryName:
          type: string
        kindCode:
          type: string
        accounting:
