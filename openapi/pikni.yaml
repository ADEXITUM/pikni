        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Редакция удалена
        default:
          $ref: "#/components/responses/Problem"

  /suppliers:
    get:
      operationId: listSuppliers
      summary: Поставщики
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Поставщики по названию
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSupplier
      summary: Добавить поставщика
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierFields"
      responses:
        "201":
          description: Поставщик добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        default:
          $ref: "#/components/responses/Problem"

  /suppliers/{id}:
    put:
      operationId: updateSupplier
      summary: Изменить поставщика
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Поставщик изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        default:
