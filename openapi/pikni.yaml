      type: string
      enum: [camera, wedge, manual]

    DocumentScanStatus:
      type: string
      enum: [accepted, selected, unknown, foreign, duplicate, rejected]
      description: >
        accepted — засчитан, selected — выбран товар с марками (дальше сканируются его марки),
        unknown — код не найден, foreign — марка не отсюда,
        duplicate — уже засчитан в документе, rejected — не подходит по другой причине

    DocumentScan:
      type: object
      required: [id, raw, status, qty, scannedAt]
      properties:
