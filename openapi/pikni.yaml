          $ref: "#/components/responses/Problem"
    post:
      operationId: createProductLine
      summary: Добавить — линейки
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductLineFields"
      responses:
        "201":
          description: Запись добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLine"
        default:
          $ref: "#/components/responses/Problem"

  /product-lines/{id}:
    put:
      operationId: updateProductLine
      summary: Изменить — линейки
      description: Бренд линейки не меняется.
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductLineUpdate"
      responses:
        "200":
          description: Запись изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLine"
        default:
          $ref: "#/components/responses/Problem"

  /products:
    get:
      operationId: listProducts
      summary: Позиции
      description: По названию. Следующая страница — параметр after из nextAfter.
      tags: [catalog]
      x-permission: refs.view
      parameters:
        - name: q
          in: query
          description: Слова наименования, часть артикула, штрихкод, алкокод, GTIN или скан марки
          schema:
            type: string
        - name: categoryId
          in: query
          description: Категория вместе с подкатегориями
          schema:
            type: string
            format: uuid
        - name: brandId
          in: query
          schema:
            type: string
            format: uuid
        - name: after
          in: query
          description: Позиция, после которой начинается страница
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Страница позиций
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProduct
      summary: Добавить позицию
      description: Артикул присваивает сервер.
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductFields"
      responses:
        "201":
          description: Позиция добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Problem"

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProduct
      summary: Карточка позиции
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Карточка позиции
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateProduct
      summary: Изменить позицию
      description: version — номер версии, с которой начата правка. Если позицию уже изменили, ответ 409.
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Позиция изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        default:
          $ref: "#/components/responses/Problem"

  /products/{id}/variants:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listProductVariants
      summary: Варианты позиции со штрихкодами
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Варианты по объёму
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createVariant
      summary: Добавить вариант
      description: Объём, тара и подарочная упаковка задают вариант и после создания не меняются.
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewVariant"
      responses:
        "201":
          description: Вариант добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        default:
          $ref: "#/components/responses/Problem"

  /products/{id}/variants/generate:
    post:
      operationId: generateVariants
      summary: Создать варианты по списку объёмов и видов тары
      description: Создаёт недостающие сочетания объёма и тары; уже существующие пропускает.
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantGeneration"
      responses:
        "201":
          description: Созданные варианты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantList"
        default:
          $ref: "#/components/responses/Problem"

  /variants/{id}:
    put:
      operationId: updateVariant
      summary: Изменить вариант
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantUpdate"
      responses:
        "200":
          description: Вариант изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variant"
        default:
          $ref: "#/components/responses/Problem"

  /variants/{id}/barcodes:
    post:
      operationId: addBarcode
      summary: Привязать штрихкод к варианту
      description: Без code сервер создаёт внутренний EAN-13 с префиксом 20.
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBarcode"
      responses:
        "201":
          description: Штрихкод привязан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Barcode"
        default:
          $ref: "#/components/responses/Problem"

  /barcodes/{code}:
    delete:
      operationId: deleteBarcode
      summary: Отвязать штрихкод
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Штрихкод отвязан
        default:
          $ref: "#/components/responses/Problem"

  /ru-subjects:
    get:
      operationId: listRuSubjects
      summary: Субъекты РФ, где есть точки или правила продажи
      tags: [locations]
      x-permission: refs.view
      responses:
        "200":
          description: Субъекты по названию
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuSubjectList"
        default:
          $ref: "#/components/responses/Problem"


components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pikni_sid
      description: >
        Cookie сессии, выдаётся при входе. Изменяющие запросы (POST, PUT, PATCH, DELETE)
        дополнительно передают заголовок X-CSRF-Token со значением csrfToken из ответа входа или /auth/me.
        Право, нужное операции, указано в расширении x-permission (authenticated — любой вошедший пользователь).

  headers:
    SessionCookie:
      description: Cookie сессии pikni_sid (HttpOnly, Secure, SameSite=Lax, Path=/api)
      schema:
        type: string

  parameters:
    AuditFrom:
      name: from
      in: query
      description: Начало периода включительно
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: Конец периода, не включая
      schema:
        type: string
        format: date-time
    AuditUserID:
      name: userId
      in: query
      description: Кто выполнил действие
      schema:
        type: string
        format: uuid
    AuditActionFilter:
      name: action
      in: query
      schema:
        $ref: "#/components/schemas/AuditAction"
    AuditEntityType:
      name: entityType
      in: query
      schema:
        type: string
        example: user
    AuditEntityID:
      name: entityId
      in: query
      schema:
        type: string

  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Role:
      type: string
      enum: [admin, manager, accountant, store_manager, storekeeper, cashier]

    Permission:
      type: string
      description: Право доступа. Матрица «роль → права» повторяет таблицу ПБ-6 ТЗ.
      enum:
        - users.manage
        - users.view
        - refs.view
        - refs.edit
        - cost.view
        - receipt.view
        - receipt.edit
        - floor.view
        - floor.edit
        - transfer.request
        - transfer.view
        - transfer.edit
        - pos.view
        - pos.sell
        - writeoff.create
        - docs.approve
        - stocktake.manage
        - stocktake.count
        - reservations.manage
        - availability.view
        - egais.reconcile
        - assets.view
        - assets.edit
        - reports.view
        - audit.view

    AuditAction:
      type: string
      description: Вид события. Русские названия — в словаре клиента.
      enum:
        - auth.login
        - auth.login_failed
        - auth.logout
        - auth.password_changed
        - auth.session_ended
        - user.created
        - user.updated
        - user.blocked
        - user.unblocked
        - user.password_reset
        - location.created
        - location.updated
        - sale_rule.created
        - sale_rule.deleted
        - sale_ban.created
        - sale_ban.deleted
        - ref.created
        - ref.updated
        - product.created
        - product.updated
        - variant.created
        - variant.updated
        - barcode.created
        - barcode.deleted

    AuditEntry:
      type: object
      required: [id, at, action, data]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        action:
          $ref: "#/components/schemas/AuditAction"
        user:
          $ref: "#/components/schemas/AuditUser"
        sessionId:
          type: string
          format: uuid
        ip:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        data:
          type: object
          additionalProperties: true
          description: Подробности события, например логин и роль созданного пользователя

    AuditUser:
      type: object
      description: Кто выполнил действие. Нет у неудачных входов и у действий консоли сервера
      required: [id, login, fullName]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        fullName:
          type: string

    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextBefore:
          type: integer
          format: int64
          description: Курсор следующей страницы; нет, если это последняя

    SessionInfo:
      type: object
      required: [id, current, createdAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
          description: Сеанс, из которого сделан запрос
        ip:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Обновляется не чаще раза в 5 минут

    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"

    User:
      type: object
      required: [id, login, fullName, role, locationIds, isBlocked, mustChangePassword, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locationIds:
          type: array
          x-go-name: LocationIDs
          items:
            type: string
            format: uuid
        isBlocked:
          type: boolean
        mustChangePassword:
          type: boolean
        lockedUntil:
          type: string
          format: date-time
          description: Вход временно закрыт после неудачных попыток
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"

    NewUser:
      type: object
      required: [login, fullName, role, locationIds]
      properties:
        login:
          type: string
          pattern: "^[A-Za-z0-9._-]{3,32}$"
          example: a.petrova
        fullName:
          type: string
          example: Петрова А. В.
        role:
          $ref: "#/components/schemas/Role"
        locationIds:
          type: array
          x-go-name: LocationIDs
          description: Обязательно для ролей магазина и склада, пусто для ролей уровня сети
          items:
            type: string
            format: uuid

    UserUpdate:
      type: object
      required: [fullName, role, locationIds, version]
      properties:
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locationIds:
          type: array
          x-go-name: LocationIDs
          items:
            type: string
            format: uuid
        version:
          type: integer
          format: int32

    CreatedUser:
      type: object
      required: [user, temporaryPassword]
      properties:
        user:
          $ref: "#/components/schemas/User"
        temporaryPassword:
          type: string

    TemporaryPassword:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: petrova
        password:
          type: string
          format: password

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    Me:
      type: object
      required: [id, login, fullName, role, mustChangePassword, csrfToken, permissions, locationIds]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        fullName:
          type: string
          example: Петрова А. В.
        role:
          $ref: "#/components/schemas/Role"
        mustChangePassword:
          type: boolean
          description: Вход по временному паролю; до смены доступны только /auth/*
        csrfToken:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        locationIds:
          type: array
          x-go-name: LocationIDs
          description: Точки, с которыми работает пользователь. Для ролей уровня сети – все точки
          items:
            type: string
            format: uuid

    LocationKind:
      type: string
      enum: [warehouse, store]

    LocationFields:
      type: object
      required: [name, city, timezone, subjectCode, openingHours, isPublic]
      properties:
        name:
          type: string
          example: Магазин на ул. Ленина
        city:
          type: string
          example: Благовещенск
        timezone:
          type: string
          description: Часовой пояс IANA
          example: Asia/Yakutsk
        subjectCode:
          type: string
          description: Код субъекта РФ, по нему действуют правила продажи алкоголя
          example: "28"
        address:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        fsrarId:
          type: string
          description: Идентификатор организации в ЕГАИС, 12 цифр
          x-go-name: FSRARID
        kpp:
          type: string
          x-go-name: KPP
        licenseNo:
          type: string
        licenseValidTo:
          type: string
          format: date
        openingHours:
          $ref: "#/components/schemas/OpeningHours"
        isPublic:
          type: boolean
          description: Показывать на публичной справочной странице

    NewLocation:
      allOf:
        - $ref: "#/components/schemas/LocationFields"
        - type: object
          required: [code, kind]
          properties:
            code:
              type: string
              example: МГ-05
            kind:
              $ref: "#/components/schemas/LocationKind"

    LocationUpdate:
      allOf:
        - $ref: "#/components/schemas/LocationFields"
        - type: object
          required: [isActive, version]
          properties:
            isActive:
              type: boolean
            version:
              type: integer
              format: int32

    Location:
      allOf:
        - $ref: "#/components/schemas/LocationFields"
        - type: object
          required: [id, code, kind, isActive, version, zones]
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
              example: МГ-01
            kind:
              $ref: "#/components/schemas/LocationKind"
            isActive:
              type: boolean
            version:
              type: integer
              format: int32
            zones:
              type: array
              items:
                $ref: "#/components/schemas/Zone"

    ZoneKind:
      type: string
      enum: [warehouse, backroom, floor]
      description: warehouse — склад, backroom — склад магазина, floor — торговый зал

    Zone:
      type: object
      required: [id, kind, name]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ZoneKind"
        name:
          type: string

    DayHours:
      type: object
      required: [open, close]
      properties:
        open:
          type: string
          example: "10:00"
        close:
          type: string
          description: "24:00 — до полуночи"
          example: "22:00"

    OpeningHours:
      type: object
      description: Часы работы по дням недели, день без часов — выходной
      properties:
        mon:
          $ref: "#/components/schemas/DayHours"
        tue:
          $ref: "#/components/schemas/DayHours"
        wed:
          $ref: "#/components/schemas/DayHours"
        thu:
          $ref: "#/components/schemas/DayHours"
        fri:
