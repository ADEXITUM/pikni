          format: uuid
          description: Если есть — параметр after для следующей страницы

    DocumentLine:
      type: object
      required: [variantId, productId, article, name, giftPack, qty]
      properties:
        variantId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        article:
          type: string
        name:
          type: string
        volumeMl:
          type: integer
          format: int32
        netWeightG:
          type: integer
          format: int32
        container:
          $ref: "#/components/schemas/Container"
        giftPack:
          type: boolean
        egaisAccounting:
          $ref: "#/components/schemas/EgaisAccounting"
        qty:
          type: integer
          format: int32
