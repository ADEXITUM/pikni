      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCategoryAttribute"
      responses:
        "201":
          description: Характеристика добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryAttribute"
