            $ref: "#/components/schemas/RuSubject"

    LocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
