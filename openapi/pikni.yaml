  /catalog/import/template:
    get:
      operationId: getImportTemplate
      summary: Шаблон импорта номенклатуры
      tags: [catalog]
      x-permission: refs.edit
      responses:
        "200":
          description: Файл XLSX с колонками, примером и справкой
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /catalog/import/preview:
    post:
      operationId: previewImport
      summary: Предпросмотр импорта номенклатуры
      description: Проверяет файл так же, как загрузку, но ничего не сохраняет.
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: XLSX или CSV по шаблону, до 5 МБ и 5000 строк
      responses:
        "200":
          description: Отчёт об импорте
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        default:
          $ref: "#/components/responses/Problem"

  /catalog/import:
    post:
      operationId: runImport
      summary: Импорт номенклатуры
      description: >
        Всё или ничего (НСИ-7) — если хоть в одной строке ошибка, ничего не сохраняется.
        Позиции, которые уже есть в каталоге, не дублируются: из расхождений с файлом
        применяются только перечисленные в accept.
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: XLSX или CSV по шаблону, до 5 МБ и 5000 строк
                accept:
                  type: string
                  description: JSON-массив ключей расхождений из предпросмотра, которые взять из файла; остальные остаются как в каталоге
                  example: '["12:price", "12:abv"]'
      responses:
        "200":
          description: Отчёт об импорте
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        default:
          $ref: "#/components/responses/Problem"

  /locations/{id}/assortment:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listAssortment
      summary: Ассортиментная матрица точки
      description: По наименованию и объёму. Следующая страница — параметр after из nextAfter.
      tags: [catalog]
      x-permission: refs.view
      parameters:
        - name: q
          in: query
          description: Слова наименования, часть артикула, штрихкод, алкокод, GTIN или скан марки
          schema:
            type: string
        - name: after
          in: query
          description: Вариант, после которого начинается страница
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Страница матрицы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssortmentList"
        default:
          $ref: "#/components/responses/Problem"

  /locations/{id}/assortment/{variantId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: variantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setAssortmentItem
      summary: Добавить вариант в матрицу или изменить минимальный остаток
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssortmentItemUpdate"
      responses:
        "204":
          description: Сохранено
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeAssortmentItem
      summary: Убрать вариант из матрицы
      tags: [catalog]
      x-permission: refs.edit
      responses:
        "204":
          description: Убрано
        default:
          $ref: "#/components/responses/Problem"

  /locations/{id}/assortment/copy:
    post:
      operationId: copyAssortment
      summary: Добавить в матрицу точки варианты из матрицы другой точки
      description: Варианты, которые уже есть в матрице, не меняются.
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssortmentCopy"
      responses:
        "200":
          description: Сколько вариантов добавлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssortmentCopyResult"
        default:
          $ref: "#/components/responses/Problem"

  /codes/resolve:
    get:
      operationId: resolveCode
      summary: Что это за товар — разбор считанного кода
      description: Штрихкод, GTIN, алкокод, скан марки ЕГАИС или код «Честного знака». Если код не найден, product и variant пустые.
      tags: [catalog]
      x-permission: refs.view
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Как понят код и что найдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeResolution"
        default:
          $ref: "#/components/responses/Problem"

  /ru-subjects:
    get:
      operationId: listRuSubjects
      summary: Субъекты РФ, где есть точки или правила продажи
      tags: [locations]
      x-permission: refs.view
      responses:
        "200":
          description: Субъекты по названию
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuSubjectList"
        default:
          $ref: "#/components/responses/Problem"


  /documents:
    get:
      operationId: listDocuments
      summary: Документы движения
      description: >
        Новые сверху. Видны документы тех видов и точек, на которые у пользователя есть право:
        ввод остатков — stocktake.manage или opening.post, передача в зал — floor.view,
        поступление — receipt.view.
        Следующая страница — параметр after из nextAfter.
      tags: [documents]
      x-permission: availability.view
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/DocumentKind"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DocumentStatus"
        - name: locationId
          in: query
          schema:
            type: string
            format: uuid
        - name: after
          in: query
          description: Документ, после которого начинается страница
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Страница документов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentList"
        default:
          $ref: "#/components/responses/Problem"

  /documents/opening:
    post:
      operationId: createOpening
      summary: Создать ввод начальных остатков по зоне
      description: Один документ на зону. Проводит руководитель или бухгалтер (opening.post).
      tags: [documents]
      x-permission: stocktake.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOpening"
      responses:
        "201":
          description: Документ создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/floor-transfer:
    post:
      operationId: createFloorTransfer
      summary: Создать передачу в торговый зал или из зала
      tags: [documents]
      x-permission: floor.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewFloorTransfer"
      responses:
        "201":
          description: Документ создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/transfer:
    post:
      operationId: createTransfer
      summary: Заявка на перемещение в свою точку
      description: >
        Подаёт точка-получатель (СО-4, НЛ-3): что, сколько, из какой точки и почему.
        Отправитель согласует или отклонит заявку, соберёт и отгрузит товар с ТТН в ЕГАИС.
      tags: [documents]
      x-permission: transfer.request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTransfer"
      responses:
        "201":
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/approve:
    post:
      operationId: approveDocument
      summary: Согласовать заявку или утвердить документ
      description: >
        Заявку на перемещение согласует точка-отправитель (право transfer.edit). Списание и сторно
        утверждает другой пользователь с правом docs.approve (ПБ-8) — тогда документ проводится.
      tags: [documents]
      x-permission: availability.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: Решение принято
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/reject:
    post:
      operationId: rejectDocument
      summary: Отклонить заявку или вернуть документ на доработку
      tags: [documents]
      x-permission: availability.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentRejection"
      responses:
        "200":
          description: Заявка отклонена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/writeoff:
    post:
      operationId: createWriteoff
      summary: Создать списание
      description: >
        Из зоны — бой, порча, истёкший срок (СО-5). С transferId — недостача перемещения, оставшаяся
        «в пути» после приёмки: строки и марки подставляются сами. Проводится после утверждения (ПБ-8).
      tags: [documents]
      x-permission: writeoff.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewWriteoff"
      responses:
        "201":
          description: Списание создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/storno:
    post:
      operationId: createStorno
      summary: Сторнировать проведённый документ
      description: >
        Создаёт черновик сторно; движения отменяются после утверждения другим пользователем (ПБ-8).
        Сторнируются ввод остатков и передача в зал без пива — у остальных документов есть след в ЕГАИС,
        их исправляет ответный документ.
      tags: [documents]
      x-permission: availability.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StornoRequest"
      responses:
        "201":
          description: Черновик сторно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/photos:
    post:
      operationId: addDocumentPhoto
      summary: Прикрепить фотографию к списанию
      description: JPEG до 3 МБ в base64; клиент уменьшает снимок перед отправкой.
      tags: [documents]
      x-permission: writeoff.create
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPhoto"
      responses:
        "201":
          description: Фотография сохранена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPhoto"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/photos/{photoId}:
    delete:
      operationId: deleteDocumentPhoto
      summary: Убрать фотографию из черновика
      tags: [documents]
      x-permission: writeoff.create
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Удалена
        default:
          $ref: "#/components/responses/Problem"

  /photos/{photoId}:
    get:
      operationId: getPhoto
      summary: Фотография документа
      tags: [documents]
      x-permission: availability.view
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Снимок
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /zones/{zoneId}/marks:
    get:
      operationId: listZoneMarks
      summary: Марки на остатке зоны
      description: Для выбора повреждённой марки, которую не считывает сканер (СО-5).
      tags: [marks]
      x-permission: writeoff.create
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: variantId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Марки
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [code, variantId]
                      properties:
                        code:
                          type: string
                        variantId:
                          type: string
                          format: uuid
        default:
          $ref: "#/components/responses/Problem"

  /documents/stocktake:
    post:
      operationId: createStocktake
      summary: Создать ревизию
      description: Полная или выборочная — по зонам, категориям, брендам (СО-6). Подсчёт начинается кнопкой «Старт».
      tags: [stocktake]
      x-permission: stocktake.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewStocktake"
      responses:
        "201":
          description: Ревизия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
