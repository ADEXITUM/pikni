      required: [variantId, productId, name, label, hereQty, networkQty]
      properties:
        variantId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        name:
          type: string
        label:
          type: string
        price:
          type: number
          format: double
        hereQty:
          type: integer
        networkQty:
          type: integer

