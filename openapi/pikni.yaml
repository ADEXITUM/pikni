    get:
      operationId: getStocktake
      summary: Ход ревизии и сличительная ведомость
      description: Зоны с прогрессом «учёт / факт», строки сличения и марки — для живого экрана ревизии.
      tags: [stocktake]
      x-permission: availability.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ход ревизии
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StocktakeState"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/zones/{zoneId}/{action}:
    post:
      operationId: stocktakeZone
