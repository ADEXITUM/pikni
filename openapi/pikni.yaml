      name: pikni_sid
      description: >
        Cookie сессии, выдаётся при входе. Изменяющие запросы (POST, PUT, PATCH, DELETE)
        дополнительно передают заголовок X-CSRF-Token со значением csrfToken из ответа входа или /auth/me.
        Право, нужное операции, указано в расширении x-permission (authenticated — любой вошедший пользователь).

  headers:
    SessionCookie:
      description: Cookie сессии pikni_sid (HttpOnly, Secure, SameSite=Lax, Path=/api)
      schema:
        type: string

  parameters:
    AssetLocation:
      name: locationId
      in: query
      schema:
        type: string
        format: uuid
    AssetResponsibleFilter:
      name: responsibleId
      in: query
      schema:
        type: string
        format: uuid
    AssetCategoryCode:
      name: category
      in: query
      schema:
        type: string
    AssetStatusParam:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/AssetStatus"
    AssetQuery:
      name: q
      in: query
      schema:
        type: string
        maxLength: 100
    AuditFrom:
      name: from
      in: query
      description: Начало периода включительно
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: Конец периода, не включая
      schema:
        type: string
        format: date-time
    AuditUserID:
      name: userId
      in: query
      description: Кто выполнил действие
      schema:
        type: string
        format: uuid
    AuditActionFilter:
      name: action
      in: query
      schema:
        $ref: "#/components/schemas/AuditAction"
    AuditEntityType:
      name: entityType
      in: query
      schema:
        type: string
        example: user
    AuditEntityID:
      name: entityId
      in: query
      schema:
        type: string

  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Role:
      type: string
      enum: [admin, manager, accountant, store_manager, storekeeper, cashier]

    Permission:
      type: string
      description: Право доступа. Матрица «роль → права» повторяет таблицу ПБ-6 ТЗ.
      enum:
        - users.manage
        - users.view
        - refs.view
        - refs.edit
        - cost.view
        - receipt.view
        - receipt.edit
        - floor.view
        - floor.edit
        - transfer.request
        - transfer.view
        - transfer.edit
        - pos.view
        - pos.sell
        - pos.devices
        - writeoff.create
        - docs.approve
        - stocktake.manage
        - stocktake.count
        - opening.post
        - reservations.manage
        - availability.view
        - egais.reconcile
        - assets.view
        - assets.edit
        - reports.view
        - audit.view

    AuditAction:
      type: string
      description: Вид события. Русские названия — в словаре клиента.
      enum:
        - auth.login
        - auth.login_failed
        - auth.login_qr
        - auth.totp_enabled
        - auth.totp_disabled
        - api_key.created
        - api_key.revoked
        - auth.logout
        - auth.password_changed
        - auth.session_ended
        - user.created
        - user.updated
        - user.blocked
        - user.unblocked
        - user.password_reset
        - user.pin_set
        - pos_device.created
        - pos_device.revoked
        - location.created
        - location.updated
        - sale_rule.created
        - sale_rule.deleted
        - sale_ban.created
        - sale_ban.deleted
        - ref.created
        - ref.updated
        - product.created
        - product.updated
        - variant.created
        - variant.updated
        - barcode.created
        - barcode.deleted
        - price.created
        - price.deleted
        - min_price.created
        - min_price.deleted
        - assortment.set
        - assortment.removed
        - assortment.copied
        - document.created
        - document.posted
        - document.cancelled
        - transfer.approved
        - transfer.rejected
        - transfer.resent
        - transfer.returned
        - document.submitted
        - document.approved
        - document.returned
        - reservation.created
        - reservation.confirmed
        - reservation.cancelled
        - reservation.issued
        - stocktake.started
        - asset.created
        - asset.updated
        - asset.moved
        - asset.status_changed
        - asset.writeoff_requested
        - asset.written_off
        - asset.writeoff_rejected
        - asset.audit_finished

    AuditEntry:
      type: object
      required: [id, at, action, data]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        action:
          $ref: "#/components/schemas/AuditAction"
        user:
          $ref: "#/components/schemas/AuditUser"
        sessionId:
          type: string
          format: uuid
        ip:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        data:
          type: object
          additionalProperties: true
          description: Подробности события, например логин и роль созданного пользователя

    AuditUser:
      type: object
      description: Кто выполнил действие. Нет у неудачных входов и у действий консоли сервера
      required: [id, login, fullName]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        fullName:
          type: string

    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextBefore:
          type: integer
          format: int64
          description: Курсор следующей страницы; нет, если это последняя

    SessionInfo:
      type: object
      required: [id, current, createdAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
          description: Сеанс, из которого сделан запрос
        ip:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Обновляется не чаще раза в 5 минут

    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"

    User:
      type: object
      required: [id, login, fullName, role, locationIds, isBlocked, mustChangePassword, version, createdAt]
