          $ref: "#/components/responses/Problem"

  /documents/{id}/start:
    post:
      operationId: startStocktake
      summary: Начать подсчёт
      description: >
        Учётный остаток зон и марок фиксируется, товары состава ревизии в точке блокируются до её
        завершения — ни продать, ни переместить их нельзя.
