openapi: 3.0.3
info:
  title: Пикни API
  version: 0.1.0
  description: API приложения сотрудников «Пикни». Кассовый API описан отдельно в pos.yaml.
servers:
  - url: /api/v1

security:
  - session: []

paths:
  /auth/login:
    post:
      operationId: login
      summary: Вход по логину и паролю
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вход выполнен
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: Выход
      tags: [auth]
      x-permission: authenticated
      responses:
        "204":
          description: Сессия завершена
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        default:
          $ref: "#/components/responses/Problem"

  /auth/me:
    get:
      operationId: getMe
      summary: Текущий пользователь и CSRF-токен сессии
      tags: [auth]
      x-permission: authenticated
      responses:
        "200":
          description: Сессия действительна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/password:
    post:
      operationId: changePassword
      summary: Смена своего пароля
      x-permission: authenticated
      description: Остальные сессии пользователя завершаются.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Пароль изменён
        default:
          $ref: "#/components/responses/Problem"

  /auth/sessions:
    get:
      operationId: listMySessions
      summary: Мои активные сеансы
      tags: [auth]
      x-permission: authenticated
      responses:
        "200":
          description: Сеансы от последней активности к ранней
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: endOtherSessions
      summary: Завершить все свои сеансы, кроме текущего
      tags: [auth]
      x-permission: authenticated
      responses:
        "204":
          description: Остальные сеансы завершены
        default:
          $ref: "#/components/responses/Problem"

  /auth/sessions/{id}:
    delete:
      operationId: endSession
      summary: Завершить свой сеанс
      tags: [auth]
      x-permission: authenticated
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Сеанс завершён
        default:
          $ref: "#/components/responses/Problem"

  /audit:
    get:
      operationId: listAuditLog
      summary: Журнал действий
      description: Записи от новых к старым. Следующая страница — параметр before из nextBefore.
      tags: [audit]
      x-permission: audit.view
      parameters:
        - name: before
          in: query
          description: Только записи с номером меньше указанного
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditUserID"
        - $ref: "#/components/parameters/AuditActionFilter"
        - $ref: "#/components/parameters/AuditEntityType"
        - $ref: "#/components/parameters/AuditEntityID"
      responses:
        "200":
          description: Страница журнала
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Problem"

  /users:
    get:
      operationId: listUsers
      summary: Сотрудники
      tags: [users]
      x-permission: users.view
      responses:
        "200":
          description: Все сотрудники по алфавиту
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUser
      summary: Создать сотрудника
      description: Пароль генерирует сервер и показывает один раз. При первом входе сотрудник придумывает свой.
      tags: [users]
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
      responses:
        "201":
          description: Сотрудник создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}:
    put:
      operationId: updateUser
      summary: Изменить ФИО, роль и точки
      description: Оптимистическая блокировка — version из открытой карточки. Если карточку уже изменили, ответ 409.
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Сотрудник изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/block:
    post:
      operationId: blockUser
      summary: Заблокировать сотрудника и завершить его сеансы
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сотрудник заблокирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/unblock:
    post:
      operationId: unblockUser
      summary: Разблокировать сотрудника
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сотрудник разблокирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/password:
    post:
      operationId: resetUserPassword
      summary: Сбросить пароль
      description: Выдаёт временный пароль, снимает блокировку за ошибки входа и завершает сеансы сотрудника.
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Временный пароль, показывается один раз
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPassword"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/sessions:
    delete:
      operationId: endUserSessions
      summary: Завершить все сеансы сотрудника
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Сеансы завершены
        default:
          $ref: "#/components/responses/Problem"

  /audit/export:
    get:
      operationId: exportAuditLog
      summary: Выгрузка журнала в Excel
      description: Те же фильтры, что у списка. Время в файле — в часовом поясе tz.
      tags: [audit]
      x-permission: audit.view
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditUserID"
        - $ref: "#/components/parameters/AuditActionFilter"
        - $ref: "#/components/parameters/AuditEntityType"
        - $ref: "#/components/parameters/AuditEntityID"
        - name: tz
          in: query
          description: Часовой пояс IANA для времени в файле, по умолчанию UTC
          schema:
            type: string
            example: Asia/Yakutsk
      responses:
        "200":
          description: Файл XLSX
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /locations:
    get:
      operationId: listLocations
      summary: Точки сети
      tags: [locations]
      x-permission: refs.view
      responses:
        "200":
          description: Склады и магазины, упорядоченные по коду
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createLocation
      summary: Создать точку
      description: Зоны учёта создаются вместе с точкой — у склада одна, у магазина две.
      tags: [locations]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewLocation"
      responses:
        "201":
          description: Точка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        default:
          $ref: "#/components/responses/Problem"

  /locations/{id}:
    get:
      operationId: getLocation
      summary: Карточка точки
      tags: [locations]
      x-permission: refs.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Точка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateLocation
      summary: Изменить точку
      description: Код и тип точки не меняются. Оптимистическая блокировка по version.
      tags: [locations]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Точка изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        default:
          $ref: "#/components/responses/Problem"

  /locations/{id}/sale-check:
    get:
      operationId: checkSale
      summary: Можно ли продавать алкоголь в точке
      description: >
        Проверка по правилам региона точки и федеральным правилам на момент at (по умолчанию — сейчас),
        отдельно для продукции крепче 15 % и для остальной алкогольной продукции.
      tags: [locations]
      x-permission: refs.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: at
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Результат проверки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleCheck"
        default:
          $ref: "#/components/responses/Problem"

  /sale-rules:
    get:
      operationId: listSaleRules
      summary: Правила продажи алкоголя и дни полного запрета
      tags: [locations]
      x-permission: refs.view
      responses:
        "200":
          description: Все редакции правил и дни запрета
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleRulebook"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSaleRule
      summary: Добавить редакцию правила продажи
      description: Без subjectCode — федеральное правило. Старые редакции не меняются.
      tags: [locations]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSaleRule"
      responses:
        "201":
          description: Редакция добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleRule"
        default:
          $ref: "#/components/responses/Problem"

  /sale-rules/{id}:
    delete:
      operationId: deleteSaleRule
      summary: Удалить редакцию, которая ещё не вступила в силу
      tags: [locations]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Редакция удалена
        default:
          $ref: "#/components/responses/Problem"

  /sale-bans:
    post:
      operationId: createSaleBan
      summary: Добавить день полного запрета
      tags: [locations]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSaleBan"
      responses:
        "201":
          description: День запрета добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleBan"
        default:
          $ref: "#/components/responses/Problem"

  /sale-bans/{id}:
    delete:
      operationId: deleteSaleBan
      summary: Удалить день запрета
      tags: [locations]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: День запрета удалён
        default:
          $ref: "#/components/responses/Problem"

  /countries:
    get:
      operationId: listCountries
      summary: Страны (ОКСМ)
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Страны (ОКСМ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryList"
        default:
          $ref: "#/components/responses/Problem"

  /origin-regions:
    get:
      operationId: listOriginRegions
      summary: Регионы происхождения
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Регионы происхождения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginRegionList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createOriginRegion
      summary: Добавить — регионы происхождения
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OriginRegionFields"
      responses:
        "201":
          description: Запись добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginRegion"
        default:
          $ref: "#/components/responses/Problem"

  /origin-regions/{id}:
    put:
      operationId: updateOriginRegion
      summary: Изменить — регионы происхождения
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OriginRegionUpdate"
      responses:
        "200":
          description: Запись изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginRegion"
        default:
          $ref: "#/components/responses/Problem"

  /producers:
    get:
      operationId: listProducers
      summary: Производители
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Производители
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProducerList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProducer
      summary: Добавить — производители
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProducerFields"
      responses:
        "201":
          description: Запись добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producer"
        default:
          $ref: "#/components/responses/Problem"

  /producers/{id}:
    put:
      operationId: updateProducer
      summary: Изменить — производители
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProducerUpdate"
      responses:
        "200":
          description: Запись изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producer"
        default:
          $ref: "#/components/responses/Problem"

  /brands:
    get:
      operationId: listBrands
      summary: Бренды
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Бренды
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createBrand
      summary: Добавить — бренды
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandFields"
      responses:
        "201":
          description: Запись добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        default:
          $ref: "#/components/responses/Problem"

  /brands/{id}:
    put:
      operationId: updateBrand
      summary: Изменить — бренды
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: Запись изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        default:
          $ref: "#/components/responses/Problem"

  /product-kinds:
    get:
      operationId: listProductKinds
      summary: Виды продукции ЕГАИС
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Виды продукции ЕГАИС
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductKindList"
        default:
          $ref: "#/components/responses/Problem"

  /volumes:
    get:
      operationId: listVolumes
      summary: Объёмы тары
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Объёмы тары
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumeList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createVolume
      summary: Добавить — объёмы тары
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewVolume"
      responses:
        "201":
          description: Запись добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volume"
        default:
          $ref: "#/components/responses/Problem"

  /volumes/{ml}:
    put:
      operationId: updateVolume
      summary: Изменить — объёмы тары
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: ml
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolumeUpdate"
      responses:
        "200":
          description: Запись изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volume"
        default:
          $ref: "#/components/responses/Problem"

  /writeoff-reasons:
    get:
      operationId: listWriteoffReasons
      summary: Причины списания
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Причины списания
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteoffReasonList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWriteoffReason
      summary: Добавить — причины списания
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteoffReasonFields"
      responses:
        "201":
          description: Запись добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteoffReason"
        default:
          $ref: "#/components/responses/Problem"

  /writeoff-reasons/{id}:
    put:
      operationId: updateWriteoffReason
      summary: Изменить — причины списания
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteoffReasonUpdate"
      responses:
        "200":
          description: Запись изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteoffReason"
        default:
          $ref: "#/components/responses/Problem"

  /categories:
    get:
