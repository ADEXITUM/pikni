          type: string
          description: Ключ кассы, показывается один раз

    LoginChallenge:
      type: object
      required: [challenge, expiresAt]
      properties:
        challenge:
          type: string
        expiresAt:
          type: string
          format: date-time

    ApiKey:
      type: object
      required: [id, name, prefix, scopes, createdAt, createdByName]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: Начало ключа — по нему ключ узнают в журнале
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time

    ApiKeyScope:
      type: string
      enum: [availability, catalog, import]
      description: availability — чтение наличия; catalog — чтение каталога; import — импорт номенклатуры

    ApiKeyRequest:
      type: object
      required: [at, method, operation, ok]
      properties:
        at:
          type: string
          format: date-time
        method:
          type: string
        operation:
          type: string
        ip:
          type: string
        ok:
          type: boolean

    SystemStatus:
      type: object
      required: [version, jobs, integrityProblems, unconfirmedTtn, openShifts, locations, checkedAt]
      properties:
        version:
          type: string
        checkedAt:
          type: string
          format: date-time
        jobs:
          type: object
          required: [available, running, retryable, failedDay]
          properties:
            available:
              type: integer
            running:
              type: integer
            retryable:
              type: integer
            failedDay:
              type: integer
              description: Задачи, отброшенные за сутки после всех попыток
        lastBackup:
          type: object
          required: [at, ok, file]
          properties:
            at:
              type: string
              format: date-time
            ok:
              type: boolean
            file:
              type: string
            sizeBytes:
              type: integer
              format: int64
        integrityProblems:
          type: integer
          description: Расхождения остатков с суммой движений (должно быть 0) по последней проверке
        integrityCheckedAt:
          type: string
          format: date-time
          description: Когда была последняя проверка целостности (фоновая задача раз в час); нет — ещё не было
        unconfirmedTtn:
          type: integer
        openShifts:
          type: integer
        govsim:
          type: string
          enum: [ok, down, off]
          description: Связь с УТМ и ГИС МТ (на стенде — имитатор)
        locations:
          type: array
          items:
            type: object
            required: [code, name, queued, utm]
            properties:
              code:
                type: string
              name:
                type: string
              queued:
                type: integer
                description: Сообщений в очереди в ЕГАИС
              oldestQueuedAt:
                type: string
                format: date-time
              lastExchangeAt:
                type: string
                format: date-time
              utm:
                type: string
                enum: [ok, delayed, down, none]

