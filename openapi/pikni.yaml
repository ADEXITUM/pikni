      x-permission: stocktake.count
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [close, reopen, recount]
      responses:
        "204":
          description: Готово
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/zones/{zoneId}/counts/{variantId}:
    put:
      operationId: setStocktakeCount
      summary: Задать посчитанное количество товара без марок
      tags: [stocktake]
      x-permission: stocktake.count
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: variantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentLineUpdate"
      responses:
        "204":
          description: Сохранено
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/forms/{form}:
    get:
      operationId: getStocktakeForm
      summary: Печатная форма документа
      description: >
        inv3 и inv19 — опись и сличительная ведомость ревизии (PDF или Excel); torg2 — акт о расхождении
        при приёмке, torg13 — накладная на внутреннее перемещение, torg16 — акт о списании (PDF).
      tags: [stocktake]
      x-permission: availability.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: form
          in: path
          required: true
          schema:
            type: string
            enum: [inv3, inv19, torg2, torg13, torg16]
        - name: format
          in: query
          schema:
            type: string
            enum: [pdf, xlsx]
            default: pdf
      responses:
        "200":
          description: Файл формы
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDocument
      summary: Документ со строками и последними сканами
      tags: [documents]
      x-permission: availability.view
      responses:
        "200":
          description: Документ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/scans:
    post:
      operationId: addDocumentScan
      summary: Скан в документ
      description: >
        id скана присваивает устройство: повтор запроса возвращает тот же результат.
        Нераспознанный или чужой код тоже сохраняется — со статусом и причиной.
        Право на изменение зависит от вида документа.
      tags: [documents]
      x-permission: availability.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDocumentScan"
      responses:
        "200":
          description: Результат скана и изменённая строка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentScanResult"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/scans/{scanId}:
    delete:
      operationId: undoDocumentScan
      summary: Отменить скан
      tags: [documents]
      x-permission: availability.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: scanId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Строка после отмены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentScanResult"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/lines/{variantId}:
    put:
      operationId: setDocumentLine
      summary: Задать количество строки вручную
      description: Только для товара без марок; 0 удаляет строку. Товар с марками считается по сканам марок.
      tags: [documents]
      x-permission: availability.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: variantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentLineUpdate"
      responses:
        "200":
          description: Документ после изменения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/mode:
    put:
      operationId: setReceivingMode
      summary: Сменить режим приёмки поступления
      description: Продукцию с марками можно принять только выборочно или поштучно.
      tags: [documents]
      x-permission: availability.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceivingModeUpdate"
      responses:
        "200":
          description: Документ после смены режима
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/post:
    post:
      operationId: postDocument
      summary: Провести документ
      description: >
        Движения записываются в регистр и меняют остатки в одной транзакции. Документ, который
        нужно отразить в ЕГАИС, получает статус awaiting_egais до ответа ЕГАИС.
      tags: [documents]
      x-permission: availability.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentVersion"
      responses:
        "200":
          description: Проведённый документ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/resend:
    post:
      operationId: resendTransfer
      summary: Отправить ТТН перемещения повторно
      description: Перемещение, ТТН которого отклонила ЕГАИС, — после устранения причины. Товар остаётся «в пути».
      tags: [documents]
      x-permission: transfer.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentVersion"
      responses:
        "200":
          description: ТТН отправлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/return:
    post:
      operationId: returnTransfer
      summary: Вернуть товар отклонённого перемещения отправителю
      description: Товар из «в пути» получателя возвращается в зону отправителя, поступление у получателя отменяется.
      tags: [documents]
      x-permission: transfer.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentVersion"
      responses:
        "200":
          description: Перемещение отменено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/cancel:
    post:
      operationId: cancelDocument
      summary: Отменить черновик
      tags: [documents]
      x-permission: availability.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentVersion"
      responses:
        "200":
          description: Отменённый документ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /availability:
    get:
      operationId: searchAvailability
      summary: Наличие по сети — поиск
      description: >
        Позиции с остатками: в точках фильтра (scopeQty), по сети (networkQty) и в текущей точке
        (hereQty). Фильтры по точкам задают, где считать остаток и что значит «только в наличии».
      tags: [availability]
      x-permission: availability.view
      parameters:
        - name: q
          in: query
          description: Слова наименования, часть артикула, штрихкод, алкокод, GTIN или скан марки
          schema:
            type: string
        - name: categoryId
          in: query
          description: Категория вместе с подкатегориями
          schema:
            type: string
            format: uuid
        - name: kindCode
          in: query
          schema:
            type: string
        - name: brandId
          in: query
          description: Бренд
          schema:
            type: string
            format: uuid
        - name: countryCode
          in: query
          schema:
            type: string
        - name: volumeMl
          in: query
          schema:
            type: integer
        - name: abvFrom
          in: query
          schema:
            type: number
            format: double
        - name: abvTo
          in: query
          schema:
            type: number
            format: double
        - name: priceFrom
          in: query
          description: Розничная цена от, ₽
          schema:
            type: number
            format: double
        - name: priceTo
          in: query
          schema:
            type: number
            format: double
        - name: city
          in: query
          schema:
            type: string
        - name: locationId
          in: query
          description: Точка
          schema:
            type: string
            format: uuid
        - name: locationKind
          in: query
          schema:
            $ref: "#/components/schemas/LocationKind"
        - name: inStock
          in: query
          description: Только то, что есть в точках фильтра
          schema:
            type: boolean
        - name: attrs
          in: query
          description: >
            Характеристики категории, JSON: значение — точное совпадение, объект {"min", "max"} —
            диапазон числа. Например {"color": "красное", "age": {"min": 5}}
          schema:
            type: string
        - name: here
          in: query
          description: Текущая точка пользователя — для столбца «здесь»
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, price, stock, new]
            default: name
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Страница позиций
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityPage"
        default:
          $ref: "#/components/responses/Problem"

  /availability/{productId}:
    get:
      operationId: getAvailability
      summary: Карточка наличия позиции
      description: Таблица «вариант × точка» — в зале, на складе, в резерве, в пути — и точки для карты.
      tags: [availability]
      x-permission: availability.view
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Карточка наличия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityCard"
        default:
          $ref: "#/components/responses/Problem"

  /availability/variants/{variantId}/similar:
    get:
      operationId: getSimilar
      summary: Похожие товары
      description: >
        Три подборки (НЛ-6): другой объём или тара позиции, другие разновидности линейки и аналоги —
        тот же вид продукции и объём, цена в пределах ±15 %, в наличии в текущей точке.
      tags: [availability]
      x-permission: availability.view
      parameters:
        - name: variantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: here
          in: query
          description: Текущая точка — для наличия аналогов «здесь»
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Подборки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarGroups"
        default:
          $ref: "#/components/responses/Problem"

  /reservations:
    get:
      operationId: listReservations
      summary: Брони
      description: Брони доступных точек, новые сверху. open — только действующие.
      tags: [reservations]
      x-permission: reservations.manage
      parameters:
        - name: locationId
          in: query
          schema:
            type: string
            format: uuid
        - name: open
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Брони
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reservation"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createReservation
      summary: Отложить товар для покупателя
      description: >
        Покупатель обратился лично или по телефону (НЛ-4). Нужно его согласие на обработку
        персональных данных. Срок — до конца следующего дня; бронь подтверждают сканом бутылки.
      tags: [reservations]
      x-permission: reservations.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewReservation"
      responses:
        "201":
          description: Бронь оформлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        default:
          $ref: "#/components/responses/Problem"

  /reservations/{id}/confirm:
    post:
      operationId: confirmReservation
      summary: Подтвердить бронь сканом
      description: Марки отложенных бутылок или штрихкод товара. Товар уходит в резерв.
      tags: [reservations]
      x-permission: reservations.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codes]
              properties:
                codes:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        "200":
          description: Бронь подтверждена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        default:
          $ref: "#/components/responses/Problem"

  /reservations/{id}/cancel:
    post:
      operationId: cancelReservation
      summary: Снять бронь
      tags: [reservations]
      x-permission: reservations.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Бронь снята
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        default:
          $ref: "#/components/responses/Problem"

  /stock/balances:
    get:
      operationId: listStockBalances
      summary: Остатки точки по зонам
      description: >
        По наименованию и объёму; варианты с нулевым остатком и без недостачи не показываются.
        Средняя себестоимость — только с правом cost.view.
      tags: [stock]
      x-permission: availability.view
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: zoneId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Слова наименования, часть артикула, штрихкод или скан
          schema:
            type: string
        - name: after
          in: query
          description: Вариант, после которого начинается страница
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Страница остатков
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockBalanceList"
        default:
          $ref: "#/components/responses/Problem"

  /stock/moves:
    get:
      operationId: listStockMoves
      summary: Карточка движения товара по зоне
      description: Новые сверху; у каждого движения — остаток после него. Суммы — только с правом cost.view.
      tags: [stock]
      x-permission: availability.view
      parameters:
        - name: variantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: zoneId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: before
          in: query
          description: Движение, до которого начинается страница
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Страница движений
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMoveList"
        default:
          $ref: "#/components/responses/Problem"

  /egais/reconciliation/{locationId}:
    get:
      operationId: getReconciliation
      summary: Сверка с ЕГАИС
      description: >
        Расхождения последнего снимка остатков ЕГАИС точки с учётом системы (СО-9): продукция без
        марок по регистрам (1 — склад, 2 — торговый зал) и марки, которые есть только с одной стороны.
      tags: [egais]
      x-permission: egais.reconcile
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сверка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reconciliation"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: requestRests
      summary: Запросить остатки в ЕГАИС
      description: Ответ придёт обменом с УТМ, обычно за минуту; снимок обновится сам.
      tags: [egais]
      x-permission: egais.reconcile
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Запрос поставлен в очередь
        default:
          $ref: "#/components/responses/Problem"

  /pairings:
    post:
      operationId: openPairing
      summary: Открыть сопряжение со смартфоном
      description: ПК показывает QR-код; смартфон того же пользователя сканирует его и становится сканером (СК-6).
      tags: [pairing]
      x-permission: authenticated
      responses:
        "201":
          description: Сопряжение ждёт смартфон
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pairing"
        default:
          $ref: "#/components/responses/Problem"

  /pairings/join:
    post:
      operationId: joinPairing
      summary: Сопрячь смартфон по QR-коду
      tags: [pairing]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Сопряжено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pairing"
        default:
          $ref: "#/components/responses/Problem"

  /pairings/{id}:
    get:
      operationId: getPairing
      summary: Состояние сопряжения
      tags: [pairing]
      x-permission: authenticated
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Состояние
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pairing"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: closePairing
      summary: Разорвать сопряжение
      tags: [pairing]
      x-permission: authenticated
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Разорвано
        default:
          $ref: "#/components/responses/Problem"

  /pairings/{id}/scans:
    post:
      operationId: sendPairedScan
      summary: Передать скан со смартфона на ПК
      description: Идентификатор скана задаёт смартфон; ПК получает код событием paired_scan.
      tags: [pairing]
      x-permission: authenticated
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scanId, raw]
              properties:
                scanId:
                  type: string
                  format: uuid
                raw:
                  type: string
                  minLength: 1
                  maxLength: 300
      responses:
        "204":
          description: Передано
        default:
          $ref: "#/components/responses/Problem"

  /price-tags/stale:
    get:
      operationId: listStalePriceTags
      summary: Ценники к перепечатке
      tags: [labels]
      x-permission: floor.view
      description: >
        Товары торгового зала точки, у которых розничная цена изменилась после печати ценника или
        ценник ещё не печатался (ЭТ-3).
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PriceTagItem"
        default:
          $ref: "#/components/responses/Problem"

  /price-tags:
    post:
      operationId: printPriceTags
      summary: Напечатать ценники
      tags: [labels]
      x-permission: floor.view
      description: >
