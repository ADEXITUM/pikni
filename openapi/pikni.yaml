openapi: 3.0.3
info:
  title: Пикни API
  version: 0.1.0
  description: API приложения сотрудников «Пикни». Кассовый API описан отдельно в pos.yaml.
servers:
  - url: /api/v1

security:
  - session: []

paths:
  /auth/login:
    post:
      operationId: login
      summary: Вход по логину и паролю
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вход выполнен
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: Выход
      tags: [auth]
      x-permission: authenticated
      responses:
        "204":
          description: Сессия завершена
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        default:
          $ref: "#/components/responses/Problem"

  /auth/me:
    get:
      operationId: getMe
      summary: Текущий пользователь и CSRF-токен сессии
      tags: [auth]
      x-permission: authenticated
      responses:
        "200":
          description: Сессия действительна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /auth/password:
    post:
      operationId: changePassword
      summary: Смена своего пароля
      x-permission: authenticated
      description: Остальные сессии пользователя завершаются.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Пароль изменён
        default:
          $ref: "#/components/responses/Problem"

  /auth/sessions:
    get:
      operationId: listMySessions
      summary: Мои активные сеансы
      tags: [auth]
      x-permission: authenticated
      responses:
        "200":
          description: Сеансы от последней активности к ранней
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: endOtherSessions
      summary: Завершить все свои сеансы, кроме текущего
      tags: [auth]
      x-permission: authenticated
      responses:
        "204":
          description: Остальные сеансы завершены
        default:
          $ref: "#/components/responses/Problem"

  /auth/sessions/{id}:
    delete:
      operationId: endSession
      summary: Завершить свой сеанс
      tags: [auth]
      x-permission: authenticated
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Сеанс завершён
        default:
          $ref: "#/components/responses/Problem"

  /audit:
    get:
      operationId: listAuditLog
      summary: Журнал действий
      description: Записи от новых к старым. Следующая страница — параметр before из nextBefore.
      tags: [audit]
      x-permission: audit.view
      parameters:
        - name: before
          in: query
          description: Только записи с номером меньше указанного
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditUserID"
        - $ref: "#/components/parameters/AuditActionFilter"
        - $ref: "#/components/parameters/AuditEntityType"
        - $ref: "#/components/parameters/AuditEntityID"
      responses:
        "200":
          description: Страница журнала
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        default:
          $ref: "#/components/responses/Problem"

  /users:
    get:
      operationId: listUsers
      summary: Сотрудники
      tags: [users]
      x-permission: users.view
      responses:
        "200":
          description: Все сотрудники по алфавиту
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUser
      summary: Создать сотрудника
      description: Пароль генерирует сервер и показывает один раз. При первом входе сотрудник придумывает свой.
      tags: [users]
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
      responses:
        "201":
          description: Сотрудник создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}:
    put:
      operationId: updateUser
      summary: Изменить ФИО, роль и точки
      description: Оптимистическая блокировка — version из открытой карточки. Если карточку уже изменили, ответ 409.
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Сотрудник изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/block:
    post:
      operationId: blockUser
      summary: Заблокировать сотрудника и завершить его сеансы
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сотрудник заблокирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/unblock:
    post:
      operationId: unblockUser
      summary: Разблокировать сотрудника
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сотрудник разблокирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/password:
    post:
      operationId: resetUserPassword
      summary: Сбросить пароль
      description: Выдаёт временный пароль, снимает блокировку за ошибки входа и завершает сеансы сотрудника.
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Временный пароль, показывается один раз
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPassword"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/sessions:
    delete:
      operationId: endUserSessions
      summary: Завершить все сеансы сотрудника
      tags: [users]
      x-permission: users.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Сеансы завершены
        default:
          $ref: "#/components/responses/Problem"

  /audit/export:
    get:
      operationId: exportAuditLog
      summary: Выгрузка журнала в Excel
      description: Те же фильтры, что у списка. Время в файле — в часовом поясе tz.
      tags: [audit]
      x-permission: audit.view
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditUserID"
        - $ref: "#/components/parameters/AuditActionFilter"
        - $ref: "#/components/parameters/AuditEntityType"
        - $ref: "#/components/parameters/AuditEntityID"
        - name: tz
          in: query
          description: Часовой пояс IANA для времени в файле, по умолчанию UTC
          schema:
            type: string
            example: Asia/Yakutsk
      responses:
        "200":
          description: Файл XLSX
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /locations:
    get:
      operationId: listLocations
      summary: Точки сети
      tags: [locations]
      x-permission: refs.view
      responses:
        "200":
          description: Склады и магазины, упорядоченные по коду
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createLocation
      summary: Создать точку
      description: Зоны учёта создаются вместе с точкой — у склада одна, у магазина две.
      tags: [locations]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewLocation"
      responses:
        "201":
          description: Точка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        default:
          $ref: "#/components/responses/Problem"

  /locations/{id}:
    get:
      operationId: getLocation
      summary: Карточка точки
      tags: [locations]
      x-permission: refs.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Точка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateLocation
      summary: Изменить точку
      description: Код и тип точки не меняются. Оптимистическая блокировка по version.
      tags: [locations]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Точка изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        default:
          $ref: "#/components/responses/Problem"

  /locations/{id}/sale-check:
    get:
      operationId: checkSale
      summary: Можно ли продавать алкоголь в точке
      description: >
        Проверка по правилам региона точки и федеральным правилам на момент at (по умолчанию — сейчас),
        отдельно для продукции крепче 15 % и для остальной алкогольной продукции.
      tags: [locations]
      x-permission: refs.view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: at
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Результат проверки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleCheck"
        default:
          $ref: "#/components/responses/Problem"

  /sale-rules:
    get:
      operationId: listSaleRules
      summary: Правила продажи алкоголя и дни полного запрета
      tags: [locations]
      x-permission: refs.view
      responses:
        "200":
          description: Все редакции правил и дни запрета
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleRulebook"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSaleRule
      summary: Добавить редакцию правила продажи
      description: Без subjectCode — федеральное правило. Старые редакции не меняются.
      tags: [locations]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSaleRule"
      responses:
        "201":
          description: Редакция добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleRule"
        default:
          $ref: "#/components/responses/Problem"

  /sale-rules/{id}:
    delete:
      operationId: deleteSaleRule
      summary: Удалить редакцию, которая ещё не вступила в силу
      tags: [locations]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Редакция удалена
        default:
          $ref: "#/components/responses/Problem"

  /sale-bans:
    post:
      operationId: createSaleBan
      summary: Добавить день полного запрета
      tags: [locations]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSaleBan"
      responses:
        "201":
          description: День запрета добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleBan"
        default:
          $ref: "#/components/responses/Problem"

  /sale-bans/{id}:
    delete:
      operationId: deleteSaleBan
      summary: Удалить день запрета
      tags: [locations]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: День запрета удалён
        default:
          $ref: "#/components/responses/Problem"

  /countries:
    get:
      operationId: listCountries
      summary: Страны (ОКСМ)
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Страны (ОКСМ)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryList"
        default:
          $ref: "#/components/responses/Problem"

  /origin-regions:
    get:
      operationId: listOriginRegions
      summary: Регионы происхождения
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Регионы происхождения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginRegionList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createOriginRegion
      summary: Добавить — регионы происхождения
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OriginRegionFields"
      responses:
        "201":
          description: Запись добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginRegion"
        default:
          $ref: "#/components/responses/Problem"

  /origin-regions/{id}:
    put:
      operationId: updateOriginRegion
      summary: Изменить — регионы происхождения
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OriginRegionUpdate"
      responses:
        "200":
          description: Запись изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginRegion"
        default:
          $ref: "#/components/responses/Problem"

  /producers:
    get:
      operationId: listProducers
      summary: Производители
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Производители
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProducerList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProducer
      summary: Добавить — производители
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProducerFields"
      responses:
        "201":
          description: Запись добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producer"
        default:
          $ref: "#/components/responses/Problem"

  /producers/{id}:
    put:
      operationId: updateProducer
      summary: Изменить — производители
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProducerUpdate"
      responses:
        "200":
          description: Запись изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producer"
        default:
          $ref: "#/components/responses/Problem"

  /brands:
    get:
      operationId: listBrands
      summary: Бренды
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Бренды
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createBrand
      summary: Добавить — бренды
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandFields"
      responses:
        "201":
          description: Запись добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        default:
          $ref: "#/components/responses/Problem"

  /brands/{id}:
    put:
      operationId: updateBrand
      summary: Изменить — бренды
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: Запись изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        default:
          $ref: "#/components/responses/Problem"

  /product-kinds:
    get:
      operationId: listProductKinds
      summary: Виды продукции ЕГАИС
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Виды продукции ЕГАИС
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductKindList"
        default:
          $ref: "#/components/responses/Problem"

  /volumes:
    get:
      operationId: listVolumes
      summary: Объёмы тары
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Объёмы тары
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumeList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createVolume
      summary: Добавить — объёмы тары
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewVolume"
      responses:
        "201":
          description: Запись добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volume"
        default:
          $ref: "#/components/responses/Problem"

  /volumes/{ml}:
    put:
      operationId: updateVolume
      summary: Изменить — объёмы тары
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: ml
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolumeUpdate"
      responses:
        "200":
          description: Запись изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volume"
        default:
          $ref: "#/components/responses/Problem"

  /writeoff-reasons:
    get:
      operationId: listWriteoffReasons
      summary: Причины списания
      tags: [catalog]
      x-permission: refs.view
      responses:
        "200":
          description: Причины списания
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteoffReasonList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWriteoffReason
      summary: Добавить — причины списания
      tags: [catalog]
      x-permission: refs.edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteoffReasonFields"
      responses:
        "201":
          description: Запись добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteoffReason"
        default:
          $ref: "#/components/responses/Problem"

  /writeoff-reasons/{id}:
    put:
      operationId: updateWriteoffReason
      summary: Изменить — причины списания
      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteoffReasonUpdate"
      responses:
        "200":
          description: Запись изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteoffReason"
        default:
          $ref: "#/components/responses/Problem"

  /ru-subjects:
    get:
      operationId: listRuSubjects
      summary: Субъекты РФ, где есть точки или правила продажи
      tags: [locations]
      x-permission: refs.view
      responses:
        "200":
          description: Субъекты по названию
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuSubjectList"
        default:
          $ref: "#/components/responses/Problem"


components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pikni_sid
      description: >
        Cookie сессии, выдаётся при входе. Изменяющие запросы (POST, PUT, PATCH, DELETE)
        дополнительно передают заголовок X-CSRF-Token со значением csrfToken из ответа входа или /auth/me.
        Право, нужное операции, указано в расширении x-permission (authenticated — любой вошедший пользователь).

  headers:
    SessionCookie:
      description: Cookie сессии pikni_sid (HttpOnly, Secure, SameSite=Lax, Path=/api)
      schema:
        type: string

  parameters:
    AuditFrom:
      name: from
      in: query
      description: Начало периода включительно
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: Конец периода, не включая
      schema:
        type: string
        format: date-time
    AuditUserID:
      name: userId
      in: query
      description: Кто выполнил действие
      schema:
        type: string
        format: uuid
    AuditActionFilter:
      name: action
      in: query
      schema:
        $ref: "#/components/schemas/AuditAction"
    AuditEntityType:
      name: entityType
      in: query
      schema:
        type: string
        example: user
    AuditEntityID:
      name: entityId
      in: query
      schema:
        type: string

  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Role:
      type: string
      enum: [admin, manager, accountant, store_manager, storekeeper, cashier]

    Permission:
      type: string
      description: Право доступа. Матрица «роль → права» повторяет таблицу ПБ-6 ТЗ.
      enum:
        - users.manage
        - users.view
        - refs.view
        - refs.edit
        - cost.view
        - receipt.view
        - receipt.edit
        - floor.view
        - floor.edit
        - transfer.request
        - transfer.view
        - transfer.edit
        - pos.view
        - pos.sell
        - writeoff.create
        - docs.approve
        - stocktake.manage
        - stocktake.count
        - reservations.manage
        - availability.view
        - egais.reconcile
        - assets.view
        - assets.edit
        - reports.view
        - audit.view

    AuditAction:
      type: string
      description: Вид события. Русские названия — в словаре клиента.
      enum:
        - auth.login
        - auth.login_failed
        - auth.logout
        - auth.password_changed
        - auth.session_ended
        - user.created
        - user.updated
        - user.blocked
        - user.unblocked
        - user.password_reset
        - location.created
        - location.updated
        - sale_rule.created
        - sale_rule.deleted
        - sale_ban.created
        - sale_ban.deleted
        - ref.created
        - ref.updated

    AuditEntry:
      type: object
      required: [id, at, action, data]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        action:
          $ref: "#/components/schemas/AuditAction"
        user:
          $ref: "#/components/schemas/AuditUser"
        sessionId:
          type: string
          format: uuid
        ip:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        data:
          type: object
          additionalProperties: true
          description: Подробности события, например логин и роль созданного пользователя

    AuditUser:
      type: object
      description: Кто выполнил действие. Нет у неудачных входов и у действий консоли сервера
      required: [id, login, fullName]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        fullName:
          type: string

    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextBefore:
          type: integer
          format: int64
          description: Курсор следующей страницы; нет, если это последняя

    SessionInfo:
      type: object
      required: [id, current, createdAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
          description: Сеанс, из которого сделан запрос
        ip:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Обновляется не чаще раза в 5 минут

    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"

    User:
      type: object
      required: [id, login, fullName, role, locationIds, isBlocked, mustChangePassword, version, createdAt]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locationIds:
          type: array
          x-go-name: LocationIDs
          items:
            type: string
            format: uuid
        isBlocked:
          type: boolean
        mustChangePassword:
          type: boolean
        lockedUntil:
          type: string
          format: date-time
          description: Вход временно закрыт после неудачных попыток
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"

    NewUser:
      type: object
      required: [login, fullName, role, locationIds]
      properties:
        login:
          type: string
          pattern: "^[A-Za-z0-9._-]{3,32}$"
          example: a.petrova
        fullName:
          type: string
          example: Петрова А. В.
        role:
          $ref: "#/components/schemas/Role"
        locationIds:
          type: array
          x-go-name: LocationIDs
          description: Обязательно для ролей магазина и склада, пусто для ролей уровня сети
          items:
            type: string
            format: uuid

    UserUpdate:
      type: object
      required: [fullName, role, locationIds, version]
      properties:
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locationIds:
          type: array
          x-go-name: LocationIDs
          items:
            type: string
            format: uuid
        version:
          type: integer
          format: int32

    CreatedUser:
      type: object
      required: [user, temporaryPassword]
      properties:
        user:
          $ref: "#/components/schemas/User"
        temporaryPassword:
          type: string

    TemporaryPassword:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: petrova
        password:
          type: string
          format: password

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    Me:
      type: object
      required: [id, login, fullName, role, mustChangePassword, csrfToken, permissions, locationIds]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        fullName:
          type: string
          example: Петрова А. В.
        role:
          $ref: "#/components/schemas/Role"
        mustChangePassword:
          type: boolean
          description: Вход по временному паролю; до смены доступны только /auth/*
        csrfToken:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        locationIds:
          type: array
          x-go-name: LocationIDs
          description: Точки, с которыми работает пользователь. Для ролей уровня сети – все точки
          items:
            type: string
            format: uuid

    LocationKind:
      type: string
      enum: [warehouse, store]

    LocationFields:
      type: object
      required: [name, city, timezone, subjectCode, openingHours, isPublic]
      properties:
        name:
          type: string
          example: Магазин на ул. Ленина
        city:
          type: string
          example: Благовещенск
        timezone:
          type: string
          description: Часовой пояс IANA
          example: Asia/Yakutsk
        subjectCode:
          type: string
          description: Код субъекта РФ, по нему действуют правила продажи алкоголя
          example: "28"
        address:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        fsrarId:
          type: string
          description: Идентификатор организации в ЕГАИС, 12 цифр
          x-go-name: FSRARID
        kpp:
          type: string
          x-go-name: KPP
        licenseNo:
          type: string
        licenseValidTo:
          type: string
          format: date
        openingHours:
          $ref: "#/components/schemas/OpeningHours"
        isPublic:
          type: boolean
          description: Показывать на публичной справочной странице

    NewLocation:
      allOf:
        - $ref: "#/components/schemas/LocationFields"
        - type: object
          required: [code, kind]
          properties:
            code:
              type: string
              example: МГ-05
            kind:
              $ref: "#/components/schemas/LocationKind"

    LocationUpdate:
      allOf:
        - $ref: "#/components/schemas/LocationFields"
        - type: object
          required: [isActive, version]
          properties:
            isActive:
              type: boolean
            version:
              type: integer
              format: int32

    Location:
      allOf:
        - $ref: "#/components/schemas/LocationFields"
        - type: object
          required: [id, code, kind, isActive, version, zones]
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
              example: МГ-01
            kind:
              $ref: "#/components/schemas/LocationKind"
            isActive:
              type: boolean
            version:
              type: integer
              format: int32
            zones:
              type: array
              items:
                $ref: "#/components/schemas/Zone"

    ZoneKind:
      type: string
      enum: [warehouse, backroom, floor]
      description: warehouse — склад, backroom — склад магазина, floor — торговый зал

    Zone:
      type: object
      required: [id, kind, name]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ZoneKind"
        name:
          type: string

    DayHours:
      type: object
      required: [open, close]
      properties:
        open:
          type: string
          example: "10:00"
        close:
          type: string
          description: "24:00 — до полуночи"
          example: "22:00"

    OpeningHours:
      type: object
      description: Часы работы по дням недели, день без часов — выходной
      properties:
        mon:
          $ref: "#/components/schemas/DayHours"
        tue:
          $ref: "#/components/schemas/DayHours"
        wed:
          $ref: "#/components/schemas/DayHours"
        thu:
          $ref: "#/components/schemas/DayHours"
        fri:
          $ref: "#/components/schemas/DayHours"
        sat:
          $ref: "#/components/schemas/DayHours"
        sun:
          $ref: "#/components/schemas/DayHours"

    SaleScope:
      type: string
      enum: [all, strong]
      description: all — вся алкогольная продукция, strong — крепче 15 %

    NewSaleRule:
      type: object
      required: [scope, validFrom, from, to, source]
      properties:
        subjectCode:
          type: string
          description: Не задан — федеральное правило
          example: "28"
        scope:
          $ref: "#/components/schemas/SaleScope"
        validFrom:
          type: string
          format: date
        from:
          type: string
          example: "11:00"
        to:
          type: string
          example: "21:00"
        source:
          type: string
          description: Закон-основание

    SaleRule:
      allOf:
        - $ref: "#/components/schemas/NewSaleRule"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid

    NewSaleBan:
      type: object
      required: [subjectCode, name, scope, source]
      description: Ровно одно из date (разовый запрет) и monthDay (ежегодный, «ММ-ДД»)
      properties:
        subjectCode:
          type: string
        name:
          type: string
          example: День знаний
        scope:
          $ref: "#/components/schemas/SaleScope"
        date:
          type: string
          format: date
        monthDay:
          type: string
          example: 09-01
        source:
          type: string

    SaleBan:
      allOf:
        - $ref: "#/components/schemas/NewSaleBan"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid

    SaleRulebook:
      type: object
      required: [rules, bans]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/SaleRule"
        bans:
          type: array
          items:
            $ref: "#/components/schemas/SaleBan"

    SaleVerdict:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
        from:
          type: string
          description: Начало окна продажи на этот день, «ЧЧ:ММ»
        to:
          type: string
          description: Конец окна, не включая
        banDay:
          type: string
          description: Название дня полного запрета

    SaleCheck:
      type: object
      required: [localTime, strong, other]
      properties:
        localTime:
          type: string
          description: Местное время точки, на которое проверено
          example: 2026-10-23T20:30:00+09:00
        strong:
          $ref: "#/components/schemas/SaleVerdict"
        other:
          $ref: "#/components/schemas/SaleVerdict"

    Country:
      type: object
      required: [code, alpha2, name]
      properties:
        code:
          type: string
          description: Цифровой код ОКСМ
          example: "643"
        alpha2:
          type: string
          example: RU
        name:
          type: string
          example: Российская Федерация

    CountryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Country"

    OriginRegionFields:
      type: object
      required: [countryCode, name]
      properties:
        countryCode:
          type: string
          example: "250"
        name:
          type: string
          example: Шампань

    OriginRegion:
      allOf:
        - $ref: "#/components/schemas/OriginRegionFields"
        - type: object
          required: [id, isActive]
          properties:
            id:
              type: string
              format: uuid
            isActive:
              type: boolean

    OriginRegionUpdate:
      allOf:
        - $ref: "#/components/schemas/OriginRegionFields"
        - type: object
          required: [isActive]
          properties:
