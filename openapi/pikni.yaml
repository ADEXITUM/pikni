      properties:
        mode:
          $ref: "#/components/schemas/ReceivingMode"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptPackage"
        unmapped:
          type: array
          description: Позиции ТТН, алкокода которых нет в каталоге
          items:
            $ref: "#/components/schemas/UnmappedPosition"
        shortage:
          type: integer
          format: int32
        surplus:
          type: integer
          format: int32
        foreign:
          type: integer
          format: int32
          description: Отсканировано чужих марок
        differences:
          type: boolean
          description: По итогам уйдёт акт расхождения, а не подтверждения

