      x-permission: stocktake.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentVersion"
      responses:
        "200":
          description: Подсчёт начат
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

  /documents/{id}/reconcile:
    post:
      operationId: reconcileStocktake
      summary: Перейти к сличению
      description: Все зоны закрыты — ведомость готова к проверке и отправке на утверждение.
      tags: [stocktake]
      x-permission: stocktake.manage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentVersion"
      responses:
        "200":
          description: Сличение
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        default:
          $ref: "#/components/responses/Problem"

