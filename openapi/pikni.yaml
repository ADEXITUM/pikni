          type: string
          format: uuid
        raw:
          type: string
        status:
          $ref: "#/components/schemas/DocumentScanStatus"
        reason:
          type: string
          description: Почему скан не засчитан — текст для пользователя
        variantId:
          type: string
          format: uuid
        article:
          type: string
        name:
          type: string
        markCode:
          type: string
        qty:
          type: integer
          format: int32
        scannedAt:
          type: string
          format: date-time
        undoneAt:
          type: string
          format: date-time

    Document:
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          required: [comment, lines, scans, canEdit, canPost]
          properties:
            comment:
              type: string
            lines:
              type: array
              items:
                $ref: "#/components/schemas/DocumentLine"
            scans:
              type: array
              description: Последние 50 сканов, новые сверху
              items:
                $ref: "#/components/schemas/DocumentScan"
            canEdit:
              type: boolean
              description: Текущий пользователь может сканировать и править черновик
            canPost:
              type: boolean
              description: Текущий пользователь может провести документ
            canApprove:
              type: boolean
              description: Заявку на перемещение можно согласовать или отклонить
            transferId:
              type: string
              format: uuid
              description: У поступления по перемещению — само перемещение
            transferNumber:
              type: string
            receiptId:
              type: string
              format: uuid
              description: У отгруженного перемещения — поступление у получателя
            receiptNumber:
              type: string
            reasonId:
              type: string
              format: uuid
            reasonName:
              type: string
            photoRequired:
              type: boolean
            photos:
              type: array
              items:
                $ref: "#/components/schemas/DocumentPhoto"
            reversesId:
              type: string
              format: uuid
              description: У сторно — исходный документ
            reversesNumber:
              type: string
            stornoId:
              type: string
              format: uuid
              description: У сторнированного документа — сторно
            stornoNumber:
              type: string
            canStorno:
              type: boolean
            approval:
              $ref: "#/components/schemas/Approval"
            receipt:
              $ref: "#/components/schemas/ReceiptInfo"
            exchange:
              type: array
              description: Журнал обмена с ЕГАИС по документу (ИН-3)
              items:
                $ref: "#/components/schemas/ExchangeMessage"

    ReceiptInfo:
      type: object
      required: [mode, packages, unmapped, shortage, surplus, foreign, differences]
