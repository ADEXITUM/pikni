      tags: [catalog]
      x-permission: refs.edit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryAttributeUpdate"
      responses:
        "200":
          description: Характеристика изменена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryAttribute"
