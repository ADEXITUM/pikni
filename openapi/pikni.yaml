            parentId:
              type: string
              format: uuid
              x-go-name: ParentID
              description: Родитель; без него — категория верхнего уровня. После создания не меняется.
            alcohol:
              type: boolean
              description: Алкогольная продукция; задаётся только у категории верхнего уровня, подкатегории наследуют

    CategoryUpdate:
      allOf:
        - $ref: "#/components/schemas/CategoryFields"
        - type: object
          required: [isActive]
          properties:
            isActive:
              type: boolean
            alcohol:
              type: boolean
              description: Меняется только у категории верхнего уровня — вместе со всеми подкатегориями

    Category:
      allOf:
        - $ref: "#/components/schemas/CategoryFields"
        - type: object
          required: [id, depth, isActive, alcohol]
          properties:
            id:
              type: string
              format: uuid
            parentId:
              type: string
              format: uuid
              x-go-name: ParentID
            alcohol:
              type: boolean
              description: Алкогольная продукция — есть вид продукции ЕГАИС, крепость, алкокод и МРЦ
            depth:
              type: integer
              format: int32
              minimum: 1
              maximum: 3
            isActive:
              type: boolean

    AttributeType:
      type: string
      enum: [enum, number, text, bool]
      description: enum — выбор из списка, number — число, text — строка, bool — да/нет

    AttributeOption:
      type: object
      required: [value, archived]
      properties:
        value:
          type: string
          example: пшеница
        archived:
          type: boolean
          description: Архивное значение остаётся у заведённых позиций, но не предлагается для новых

    CategoryAttributeFields:
      type: object
      required: [name, filterable, usedForAnalogs, sort]
      properties:
        name:
          type: string
          example: Сырьё
        unit:
          type: string
          description: Единица измерения, только для чисел
          example: лет
        filterable:
          type: boolean
          description: Показывать в фильтрах поиска
        usedForAnalogs:
          type: boolean
          description: Учитывать при подборе аналогов
        sort:
          type: integer
          format: int32

    NewCategoryAttribute:
      allOf:
        - $ref: "#/components/schemas/CategoryAttributeFields"
        - type: object
          required: [code, type]
          properties:
            code:
              type: string
              description: Латиница в нижнем регистре, цифры и _; уникален в ветке категорий
              example: raw_material
            type:
              $ref: "#/components/schemas/AttributeType"
            options:
              type: array
              description: Значения списка, только для типа enum
              items:
                type: string

    CategoryAttributeUpdate:
      allOf:
        - $ref: "#/components/schemas/CategoryAttributeFields"
        - type: object
          required: [options, isActive]
          properties:
            options:
              type: array
              description: Все прежние значения плюс новые; прежние можно только архивировать
              items:
                $ref: "#/components/schemas/AttributeOption"
            isActive:
              type: boolean

    CategoryAttribute:
      allOf:
        - $ref: "#/components/schemas/CategoryAttributeFields"
        - type: object
          required: [id, categoryId, code, type, options, isActive]
          properties:
            id:
              type: string
              format: uuid
            categoryId:
              type: string
              format: uuid
              x-go-name: CategoryID
            code:
              type: string
            type:
              $ref: "#/components/schemas/AttributeType"
            options:
              type: array
              items:
                $ref: "#/components/schemas/AttributeOption"
            isActive:
              type: boolean

    CategoryTree:
      type: object
      required: [categories, attributes]
      description: Плоские списки; подкатегория наследует характеристики всех предков
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/CategoryAttribute"

    ProductLineFields:
      type: object
      required: [brandId, name]
      properties:
        brandId:
          type: string
          format: uuid
        name:
          type: string
          example: Тайга

    ProductLine:
      allOf:
        - $ref: "#/components/schemas/ProductLineFields"
        - type: object
          required: [id, isActive]
          properties:
            id:
              type: string
              format: uuid
            isActive:
              type: boolean

    ProductLineUpdate:
      type: object
      required: [name, isActive]
      properties:
        name:
          type: string
        isActive:
          type: boolean

    ProductLineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductLine"

    ProductFields:
      type: object
      required: [name, categoryId, crptMarked, producerId, countryCode, attributes]
      properties:
        name:
          type: string
          example: Водка «Тайга» на пшенице
        categoryId:
          type: string
          format: uuid
        kindCode:
          type: string
          description: Вид продукции ЕГАИС; без него позиция не учитывается в ЕГАИС
          example: "200"
        abv:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Крепость, % об.; обязательна для алкоголя
          example: 40
        crptMarked:
          type: boolean
          description: Маркируется «Честным знаком»
        producerId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
          description: Бренд этого производителя
        productLineId:
          type: string
          format: uuid
          description: Линейка этого бренда
        variety:
          type: string
          description: Разновидность в линейке
          example: на пшенице
        countryCode:
          type: string
          example: "643"
        originRegionId:
          type: string
          format: uuid
          description: Регион этой страны
        attributes:
          type: object
          additionalProperties: true
          description: Характеристики по схеме категории — код → значение; пустые не сохраняются
          example: { raw_material: пшеница }

    ProductUpdate:
      allOf:
        - $ref: "#/components/schemas/ProductFields"
        - type: object
          required: [isActive, version]
          properties:
            isActive:
              type: boolean
            version:
              type: integer
              format: int32

    Product:
      allOf:
        - $ref: "#/components/schemas/ProductFields"
        - type: object
          required: [id, categoryName, producerName, countryName, isActive, version]
          properties:
            id:
              type: string
              format: uuid
            categoryName:
              type: string
            producerName:
              type: string
            brandName:
              type: string
            lineName:
              type: string
            countryName:
              type: string
            regionName:
              type: string
            egaisAccounting:
              $ref: "#/components/schemas/EgaisAccounting"
            isActive:
              type: boolean
            version:
              type: integer
              format: int32

    ProductPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        nextAfter:
          type: string
          format: uuid
          description: Если есть — параметр after для следующей страницы
        scan:
          $ref: "#/components/schemas/ScanResult"

    CodeResolution:
      type: object
      properties:
        scan:
          $ref: "#/components/schemas/ScanResult"
        product:
          $ref: "#/components/schemas/Product"
        variant:
          $ref: "#/components/schemas/Variant"

    ScanKind:
      type: string
      enum: [barcode, alcocode, egais_mark, egais_mark_new, crpt_code, article]
      description: >
        Как сервер понял поисковую строку: article — артикул варианта (ЧК-000001),
        barcode — штрихкод или GTIN, alcocode — алкокод,
        egais_mark — марка ЕГАИС старого образца (68 символов, из неё взят алкокод),
        egais_mark_new — марка нового образца (150 символов, алкокода в ней нет),
        crpt_code — код «Честного знака» (из него взят GTIN)

    ScanResult:
      type: object
      required: [kind, code]
      description: Есть, если поисковая строка похожа на код или скан
      properties:
        kind:
          $ref: "#/components/schemas/ScanKind"
        code:
          type: string
          description: Что искали — штрихкод, алкокод или GTIN; для марки нового образца — её тип, серия и номер

    Container:
      type: string
      enum: [glass, pet, can]
      description: glass — стекло, pet — ПЭТ, can — банка

    BarcodeKind:
      type: string
      enum: [ean13, ean8, upca, code128, internal]
      description: Определяется сервером; internal — EAN-13 с префиксом 2 для внутреннего применения

    Barcode:
      type: object
      required: [code, kind]
      properties:
        code:
          type: string
          example: "4600000000011"
        kind:
          $ref: "#/components/schemas/BarcodeKind"

    NewBarcode:
      type: object
      properties:
        code:
          type: string
          description: Без кода сервер создаст внутренний EAN-13

    VariantCodes:
      type: object
      properties:
        alcocode:
          type: string
          description: Код продукции ЕГАИС, 19 цифр; только для продукции в ЕГАИС
          example: "0177207000002463655"
        gtin:
          type: string
          description: GTIN для кодов «Честного знака»; можно ввести EAN-8, UPC или EAN-13 — сохранится 14 цифр
          example: "04600000000011"

    NewVariant:
      allOf:
        - $ref: "#/components/schemas/VariantCodes"
        - type: object
          required: [giftPack]
          properties:
            volumeMl:
              type: integer
              format: int32
              description: Объём из справочника; обязателен для продукции в ЕГАИС
              example: 500
            netWeightG:
              type: integer
              format: int32
              minimum: 1
              maximum: 100000
              description: Масса нетто в граммах — фасовка сопутствующих товаров; вместе с объёмом не указывается
              example: 70
            container:
              $ref: "#/components/schemas/Container"
            giftPack:
              type: boolean

    VariantUpdate:
      allOf:
        - $ref: "#/components/schemas/VariantCodes"
        - type: object
          required: [isActive]
          properties:
            isActive:
              type: boolean

    Variant:
      allOf:
        - $ref: "#/components/schemas/NewVariant"
        - type: object
          required: [id, productId, article, isActive, barcodes]
          properties:
            id:
              type: string
              format: uuid
            productId:
              type: string
              format: uuid
            article:
              type: string
              description: Артикул присваивает сервер; у каждого варианта свой
              example: ЧК-000001
            isActive:
              type: boolean
            barcodes:
              type: array
              items:
                $ref: "#/components/schemas/Barcode"
            retailPrice:
              type: number
              format: double
              description: Действующая розничная цена
            minPrice:
              type: number
              format: double
              description: Действующая МРЦ для этого объёма и крепости
            purchasePrice:
              type: number
              format: double
              description: Действующая закупочная цена; только при праве cost.view

    VariantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Variant"

    VariantGeneration:
      type: object
      required: [volumes, containers, giftPack]
      properties:
        volumes:
          type: array
          minItems: 1
          items:
            type: integer
            format: int32
          example: [500, 700]
        containers:
          type: array
          description: Пустой список — варианты без тары
          items:
            $ref: "#/components/schemas/Container"
        giftPack:
          type: boolean

    MinPriceGroup:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: vodka
        name:
          type: string
          example: Водка

    NewMinPrice:
      type: object
      required: [groupCode, validFrom, abvFrom, price, volumeMl, source]
      description: Полоса крепости одной редакции МРЦ — строка приложения к приказу Минфина
      properties:
        groupCode:
          type: string
          example: vodka
        validFrom:
          type: string
          format: date
        abvFrom:
          type: number
          format: double
          description: Крепость «свыше», %; 0 — цена не зависит от крепости
          example: 39
        abvTo:
          type: number
          format: double
          description: Крепость «до … включительно», %; пусто — без верхней границы
          example: 40
        price:
          type: number
          format: double
          description: Цена эталонного объёма, рубли
          example: 409
        volumeMl:
          type: integer
          format: int32
          description: Эталонный объём; для другого объёма цена пересчитывается пропорционально
          example: 500
        samePriceOverMl:
          type: integer
          format: int32
          description: Тара свыше этого объёма и до эталонного стоит как эталонная (у водки — 375)
          example: 375
        source:
          type: string
          description: Приказ Минфина — основание

    MinPrice:
      allOf:
        - $ref: "#/components/schemas/NewMinPrice"
        - type: object
          required: [id, groupName]
          properties:
            id:
              type: string
              format: uuid
            groupName:
              type: string

    MinPriceList:
      type: object
      required: [items, groups]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MinPrice"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/MinPriceGroup"

    PriceKind:
      type: string
      enum: [retail, purchase]
      description: retail — розничная, purchase — закупочная по умолчанию

    NewPrice:
      type: object
      required: [price]
      properties:
        price:
          type: number
          format: double
          minimum: 0.01
          description: Рубли с копейками
          example: 449.9
        validFrom:
          type: string
          format: date-time
          description: С какого момента действует; без него — сразу

    Price:
      type: object
      required: [id, kind, price, validFrom]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/PriceKind"
        price:
          type: number
          format: double
        validFrom:
          type: string
          format: date-time
        setBy:
          type: string
          description: Кто назначил

    PriceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Price"

    ReceivingMode:
      type: string
      enum: [document, boxes, sample, piece]
      description: Режим приёмки (СО-2) — по документу, по коробам, выборочно, поштучно

    SupplierContacts:
      type: object
      properties:
        person:
          type: string
          example: Иванова Мария, менеджер
        phone:
          type: string
          example: +7 4162 00-00-00
        email:
          type: string
          example: sales@example.ru

    SupplierFields:
      type: object
      required: [name, inn, defaultReceivingMode, contacts]
      properties:
        name:
          type: string
          example: ООО «Амур-Дистрибуция»
        inn:
          type: string
          x-go-name: INN
          description: 10 цифр у организации, 12 — у предпринимателя; контрольные цифры проверяются
        kpp:
          type: string
          x-go-name: KPP
          description: 9 цифр; у предпринимателя КПП нет
        fsrarId:
          type: string
          x-go-name: FSRARID
          description: 12 цифр
        licenseNo:
          type: string
        licenseValidTo:
          type: string
          format: date
        defaultReceivingMode:
          $ref: "#/components/schemas/ReceivingMode"
        contacts:
          $ref: "#/components/schemas/SupplierContacts"

    Supplier:
      allOf:
        - $ref: "#/components/schemas/SupplierFields"
        - type: object
          required: [id, isActive]
          properties:
            id:
              type: string
              format: uuid
            isActive:
              type: boolean

    SupplierUpdate:
      allOf:
        - $ref: "#/components/schemas/SupplierFields"
        - type: object
          required: [isActive]
          properties:
            isActive:
              type: boolean

    SupplierList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Supplier"

    ImportError:
      type: object
      required: [row, message]
      properties:
        row:
          type: integer
          description: Номер строки в файле; 0 — ошибка файла целиком
        message:
          type: string

    ImportReport:
      type: object
      required: [committed, rows, products, existing, variants, newProducers, newBrands, newLines, changes, errors]
      properties:
        committed:
          type: boolean
          description: true — данные сохранены; при предпросмотре всегда false
        rows:
          type: integer
        products:
          type: integer
          description: Позиций создано (или будет создано)
        existing:
          type: integer
          description: Позиций, которые уже есть в каталоге (производитель и наименование совпали)
        variants:
          type: integer
        newProducers:
          type: array
          items:
            type: string
        newBrands:
          type: array
          items:
            type: string
        newLines:
          type: array
          items:
            type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ImportChange"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportError"

    ImportChange:
      type: object
      description: >
        Расхождение файла с каталогом у позиции или варианта, которые уже есть. Как конфликт при
        слиянии веток: пользователь выбирает, оставить значение каталога или взять из файла.
      required: [key, row, product, field, old, new]
      properties:
        key:
          type: string
          description: Строка и поле; одинаков при предпросмотре и загрузке того же файла
          example: "12:price"
        row:
          type: integer
        product:
          type: string
        variant:
          type: string
          description: Подпись варианта, если расхождение в варианте
        field:
          type: string
          example: Цена
        old:
          type: string
          description: Значение в каталоге
          example: 459,00 ₽
        new:
          type: string
          description: Значение в файле
          example: 479,00 ₽

    AssortmentItem:
      type: object
      required: [variantId, productId, article, name, giftPack, isActive, minQty]
      properties:
        variantId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        article:
          type: string
        name:
          type: string
        volumeMl:
          type: integer
          format: int32
        netWeightG:
          type: integer
          format: int32
        container:
          $ref: "#/components/schemas/Container"
        giftPack:
          type: boolean
        isActive:
          type: boolean
          description: false — позиция или вариант в архиве
        minQty:
          type: integer
          format: int32

    AssortmentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssortmentItem"
        total:
          type: integer
          description: Сколько вариантов подходит под поиск, на всех страницах
        nextAfter:
          type: string
          format: uuid
          description: Если есть — параметр after для следующей страницы

    AssortmentItemUpdate:
      type: object
      required: [minQty]
      properties:
        minQty:
          type: integer
          format: int32
          minimum: 1
          maximum: 9999
          description: Минимальный остаток, штук

    AssortmentCopy:
      type: object
      required: [fromLocationId]
      properties:
        fromLocationId:
          type: string
          format: uuid

    AssortmentCopyResult:
      type: object
      required: [added]
      properties:
        added:
          type: integer

    DocumentKind:
      type: string
      enum: [opening, floor_transfer, receipt, sale, transfer, writeoff, storno, stocktake]
      description: >
        opening — ввод начальных остатков, floor_transfer — передача в торговый зал или из зала,
        receipt — поступление по ТТН ЕГАИС, sale — продажа смены кассы, transfer — перемещение между точками

    DocumentStatus:
      type: string
      enum: [requested, rejected, draft, counting, reconciling, pending_approval, in_transit, awaiting_egais, posted, egais_rejected, cancelled, reversed]
      description: >
        draft — черновик, awaiting_egais — проведён в учёте и ждёт ответа ЕГАИС,
        posted — проведён, egais_rejected — ЕГАИС отказала, cancelled — черновик отменён;
        у перемещения requested — заявка, rejected — отклонена, in_transit — отгружено, в пути;
        pending_approval — ждёт утверждения (ПБ-8), reversed — сторнирован

    DocumentSummary:
      type: object
      required: [id, kind, number, status, docDate, locationId, locationName, zoneId, zoneKind, authorName, lineCount, totalQty, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/DocumentKind"
        number:
          type: string
          description: Префикс, год и порядковый номер — ВО-2026-000001
        status:
          $ref: "#/components/schemas/DocumentStatus"
        docDate:
          type: string
          format: date
          description: Местная дата точки
        locationId:
          type: string
          format: uuid
        locationName:
          type: string
        zoneId:
          type: string
          format: uuid
        zoneKind:
          $ref: "#/components/schemas/ZoneKind"
        destZoneId:
          type: string
          format: uuid
        destZoneKind:
          $ref: "#/components/schemas/ZoneKind"
        authorName:
          type: string
          description: Сотрудник или «ЕГАИС», если документ создан по пришедшей ТТН
        supplierName:
          type: string
        ttnNumber:
          type: string
        receivingMode:
          $ref: "#/components/schemas/ReceivingMode"
        postedByName:
          type: string
        lineCount:
          type: integer
          format: int32
        totalQty:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        postedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
        destLocationId:
          type: string
          format: uuid
