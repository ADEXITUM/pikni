openapi: 3.0.3
info:
  title: Пикни API
  version: 0.1.0
  description: API приложения сотрудников «Пикни». Кассовый API описан отдельно в pos.yaml.
servers:
  - url: /api/v1

paths:
  /locations:
    get:
      operationId: listLocations
      summary: Точки сети
      tags: [locations]
      responses:
        "200":
          description: Склады и магазины, упорядоченные по коду
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationList"
        default:
          $ref: "#/components/responses/Problem"

components:
  responses:
    Problem:
      description: Ошибка в формате RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    LocationKind:
      type: string
      enum: [warehouse, store]

    Location:
      type: object
      required: [id, code, name, kind, city, timezone]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: МГ-01
        name:
          type: string
          example: Магазин на ул. Ленина
        kind:
          $ref: "#/components/schemas/LocationKind"
        city:
          type: string
          example: Благовещенск
        timezone:
          type: string
          description: Часовой пояс IANA
          example: Asia/Yakutsk

    LocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Не найдено
        status:
          type: integer
          example: 404
        detail:
          type: string
