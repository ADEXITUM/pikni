        abv:
          type: number
          format: double
        brandName:
          type: string
        countryName:
          type: string
        lineName:
          type: string
        variety:
          type: string
        variants:
          type: integer
        minPrice:
          type: number
          format: double
          description: Розничная цена, ₽ — наименьшая среди вариантов
        maxPrice:
          type: number
          format: double
        scopeQty:
          type: integer
          description: Остаток в точках фильтра
        networkQty:
          type: integer
        hereQty:
          type: integer

    AvailabilityPage:
